name: FAM RU agent governance

on:
  pull_request:
    branches: ["migration/yandex-cloud"]
    paths:
      - "ru-migration/app/backend/policies/agent-team.mjs"
      - "ru-migration/app/backend/repositories/ydb-agent-task-queue.mjs"
      - "ru-migration/app/backend/services/coder-task-bridge.mjs"
      - "ru-migration/compat/fam-agent-team-governance.mjs"
      - "ru-migration/compat/fam-agent-team-governance.test.mjs"
      - "ru-migration/compat/fam-agent-execution-evidence*.mjs"
      - "ru-migration/compat/fam-agent-governance-rehearsal*.mjs"
      - "ru-migration/compat/run-fam-agent-governance-rehearsal.mjs"
      - "ru-migration/compat/synthetic-batch-migration*.mjs"
      - "ru-migration/compat/synthetic-operational-*.mjs"
      - "ru-migration/compat/fam-route-parity.test.mjs"
      - "ru-migration/compat/fam-agent-execution-evidence.mjs"
      - "ru-migration/compat/fam-agent-execution-evidence.test.mjs"
      - "ru-migration/compat/fam-agent-governance-rehearsal.mjs"
      - "ru-migration/compat/fam-agent-governance-rehearsal.test.mjs"
      - "ru-migration/compat/run-fam-agent-governance-rehearsal.mjs"
      - "ru-migration/compat/fam-cutover-readiness*.mjs"
      - "ru-migration/compat/fam-legal-cutover-evidence.mjs"
      - "ru-migration/legal/**"
      - ".github/workflows/fam-ru-agent-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Изолированные тесты штаба FAM RU
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "22"
      - run: node --test ru-migration/compat/fam-agent-team-governance.test.mjs ru-migration/compat/fam-agent-execution-evidence.test.mjs ru-migration/compat/fam-agent-governance-rehearsal.test.mjs ru-migration/compat/synthetic-batch-migration.test.mjs ru-migration/compat/synthetic-operational-migration.test.mjs ru-migration/compat/synthetic-operational-envelope.test.mjs ru-migration/compat/fam-cutover-readiness.test.mjs ru-migration/compat/fam-route-parity.test.mjs ru-migration/app/backend/test/coder-task-bridge.test.mjs ru-migration/app/backend/test/ydb-agent-task-queue.test.mjs
      - run: node ru-migration/compat/run-fam-agent-governance-rehearsal.mjs
