name: FAM RU local YDB integration
on:
  push:
    branches: ["migration/yandex-cloud"]
    paths:
      - "ru-migration/app/backend/repositories/**"
      - "ru-migration/app/backend/schema/**"
      - "ru-migration/compat/**"
      - ".github/workflows/fam-ru-ydb-local.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-ydb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked SDK dependencies
        run: npm ci --prefix ru-migration/compat --no-audit --no-fund
      - name: Start disposable local database
        run: docker run -d --name fam-ru-test-ydb --hostname localhost -p 127.0.0.1:2136:2136 -e GRPC_PORT=2136 -e YDB_GRPC_ENABLE_TLS=false -e YDB_USE_IN_MEMORY_PDISKS=true ydbplatform/local-ydb:latest
      - name: Wait for database and apply isolated schema
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if docker exec fam-ru-test-ydb /ydb -e grpc://localhost:2136 -d /local --no-discovery sql -s 'SELECT 1;' >/dev/null 2>&1; then break; fi
            if [ "$i" = 120 ]; then docker logs fam-ru-test-ydb; exit 1; fi
            sleep 2
          done
          docker exec -i fam-ru-test-ydb /ydb -e grpc://localhost:2136 -d /local --no-discovery sql -s "$(cat ru-migration/app/backend/schema/01_listings.yql)"
      - name: Exercise schema and repository with synthetic data
        run: node ru-migration/compat/integration-ydb.mjs
      - name: Remove disposable database
        if: always()
        run: docker rm -f fam-ru-test-ydb || true
