name: FAM bounded coder retry PostgreSQL integration

on:
  pull_request:
    paths:
      - "supabase/migrations/20261113100000_fam_agent_bounded_coder_retries.sql"
      - "supabase/migrations/20261111153059_fam_agent_coder_queue_bridge.sql"
      - "tests/sql/fam-agent-coder-retry-*"
      - ".github/workflows/fam-agent-coder-retry-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coder-retry-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fam_coder_retry_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fam_coder_retry_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: fam_coder_retry_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Create isolated retry fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-retry-bootstrap.sql
      - name: Install baseline coder queue RPCs
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111153059_fam_agent_coder_queue_bridge.sql
      - name: Apply bounded retry migration to PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113100000_fam_agent_bounded_coder_retries.sql
      - name: Verify retry lifecycle, context and producer serialization
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-retry-assert.sql
