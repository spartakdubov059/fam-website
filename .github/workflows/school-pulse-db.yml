name: FAM PostgreSQL safety tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/sql/school-pulse-DRAFT.sql'
      - 'tests/sql/school-pulse-*'
      - 'supabase/migrations/*fam_agent_bounded_coder_retries.sql'
      - 'tests/sql/fam-agent-coder-retry-*'
      - '.github/workflows/school-pulse-db.yml'
permissions:
  contents: read
jobs:
  postgres-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: school_pulse_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_pulse_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: school_pulse_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build disposable school database
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/school-pulse-bootstrap.sql
      - name: Verify schema parses on PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/school-pulse-DRAFT.sql
      - name: Verify privacy, one vote and school isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/school-pulse-assert.sql
      - name: Build disposable FAM coder queue fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-retry-bootstrap.sql
      - name: Apply bounded retry migration to PostgreSQL 17 fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113100000_fam_agent_bounded_coder_retries.sql
      - name: Verify retry limit, cooldown, lease and RPC permissions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-retry-assert.sql
