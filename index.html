<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAM — свои рядом</title>

<!-- Основной CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Резерв, если первый не загрузился -->
<script>
  if (!window.supabase) {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>

<style>
:root {
  --bg: #17181C;
  --surface: #25272D;
  --surface-hover: #2D3037;
  --accent: #D4D7DE;
  --accent-hover: #FFFFFF;
  --text: #F5F5F5;
  --muted: #A5A7B0;
  --border: #363840;
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
  transition:
    background 0.2s ease,
    transform 0.2s ease,
    opacity 0.2s ease;
}

button:active {
  transform: scale(0.98);
}

/* Шапка */

header {
  background: rgba(23, 24, 28, 0.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
}

/* Логотип */

.logo,
.logo span {
  color: var(--text);
}

/* Главный экран */

.hero {
  background: linear-gradient(135deg, #292C33, #202126);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 32px;
  overflow: hidden;
}

.hero h1 {
  color: var(--text);
  font-size: clamp(30px, 5vw, 48px);
  line-height: 1.08;
  letter-spacing: -1.5px;
  font-weight: 800;
}

.hero p {
  color: var(--muted);
  line-height: 1.6;
}

/* Кнопки */

button.primary,
.primary,
#authButton {
  background: var(--accent);
  color: #17181C;
  border: none;
  border-radius: 14px;
  padding: 12px 18px;
  font-weight: 700;
}

button.primary:hover,
.primary:hover,
#authButton:hover {
  background: var(--accent-hover);
}

button.secondary,
.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 18px;
}

button.secondary:hover,
.secondary:hover {
  background: var(--surface-hover);
}

/* Поля поиска и формы */

input,
textarea,
select {
  width: 100%;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 13px 15px;
  outline: none;
}

input::placeholder,
textarea::placeholder {
  color: #777A85;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #777C88;
  box-shadow: 0 0 0 3px rgba(212, 215, 222, 0.08);
}

/* Карточки */

.card,
.listing-card,
.listing,
article {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.card:hover,
.listing-card:hover,
.listing:hover,
article:hover {
  background: var(--surface-hover);
  border-color: #50535D;
  transform: translateY(-2px);
}

/* Заголовки и текст */

h1,
h2,
h3,
h4 {
  color: var(--text);
  letter-spacing: -0.4px;
}

p,
small,
.subtitle {
  color: var(--muted);
}

/* Ссылки */

a {
  color: var(--text);
  text-decoration: none;
}

a:hover {
  color: var(--accent);
}

/* Разделители */

hr {
  border: 0;
  border-top: 1px solid var(--border);
}

/* Модальные окна */

.modal,
.modal-content,
.dialog {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
}

/* Нижняя часть сайта */

footer {
  color: var(--muted);
  border-top: 1px solid var(--border);
}

/* Полосы прокрутки */

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  background: #41434B;
  border-radius: 10px;
}

/* Мобильная версия */

@media (max-width: 600px) {
  .hero {
    padding: 24px 20px;
    border-radius: 22px;
  }

  .hero h1 {
    font-size: 34px;
  }

  button {
    min-height: 42px;
  }
}
</head>
<body>

<header>
  <div>
    <div class="logo">FAM<span>.</span></div>
    <div class="small">Свои рядом</div>
  </div>
  <button id="authButton" class="accent">Войти</button>
</header>

<main>
  <section class="hero">
    <h1>Нашёл своих.<br>Нашёл нужное.</h1>
    <p>Объявления, идеи и помощь от ребят рядом.</p>
    <div class="actions">
      <button class="accent" id="addButton">＋ Разместить объявление</button>
      <button id="myButton" class="hidden">Мои объявления</button>
    </div>
  </section>

  <div id="notice" class="notice hidden"></div>

  <h2 id="heading">Свежие объявления</h2>
  <div class="filters">
    <input id="search" placeholder="Поиск объявлений">
    <select id="category">
      <option value="">Все категории</option>
      <option>Вещи</option>
      <option>Услуги</option>
      <option>Творчество</option>
      <option>Учёба</option>
    </select>
  </div>
  <div id="listings" class="grid">Загрузка объявлений…</div>
</main>

<footer>
FAM — площадка для объявлений. Не публикуй пароли, домашний адрес и другие личные данные. Не отправляй незнакомцам деньги. Несовершеннолетним следует обсуждать встречи с незнакомыми людьми с родителями.
</footer>

<div id="modal" class="modal hidden">
  <div class="box">
    <button id="close" style="float:right">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================================================
   1. НАСТРОЙКИ
   ========================================================= */
const SUPABASE_URL = "https://tfacqpljrvfpcrhdovbu.supabase.co";
const SUPABASE_KEY = "sb_publishable_r-hL_4KacupEsWa4v0BLPQ_O5drs3aG";

/* =========================================================
   2. УТИЛИТЫ И ГЛОБАЛЬНАЯ ОБРАБОТКА ОШИБОК
   ========================================================= */
const $ = id => document.getElementById(id);

function showNotice(text, isError) {
  const n = $("notice");
  if (!n) return;
  n.textContent = text;
  n.classList.toggle("error", !!isError);
  n.classList.remove("hidden");
  clearTimeout(showNotice._t);
  showNotice._t = setTimeout(() => n.classList.add("hidden"), 6000);
}

function setListingsText(text) {
  const el = $("listings");
  if (el) el.textContent = text;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

// Ловим любые ошибки страницы и показываем их
window.addEventListener("error", e => {
  setListingsText("ОШИБКА: " + (e.message || "неизвестная") +
    (e.lineno ? " (строка " + e.lineno + ")" : ""));
  showNotice("Ошибка: " + (e.message || "неизвестная"), true);
});

/* =========================================================
   3. ПРОВЕРКА ЗАГРУЗКИ БИБЛИОТЕКИ
   ========================================================= */
if (!window.supabase) {
  setListingsText("ОШИБКА: библиотека Supabase не загрузилась. Проверь интернет или блокировщик рекламы.");
  $("authButton").disabled = true;
  $("addButton").disabled = true;
  showNotice("Библиотека Supabase не загрузилась", true);
  throw new Error("Supabase SDK not loaded");
}

/* =========================================================
   4. СОЗДАНИЕ КЛИЕНТА
   ========================================================= */
let db;
try {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  setListingsText("ОШИБКА создания клиента: " + e.message);
  showNotice("Ошибка клиента: " + e.message, true);
  throw e;
}

/* =========================================================
   5. СОСТОЯНИЕ
   ========================================================= */
let user = null;
let listings = [];
let onlyMine = false;

/* =========================================================
   6. МОДАЛЬНОЕ ОКНО
   ========================================================= */
function openModal(html) {
  $("modalContent").innerHTML = html;
  $("modal").classList.remove("hidden");
}
function closeModal() {
  $("modal").classList.add("hidden");
  $("modalContent").innerHTML = "";
}
$("close").onclick = closeModal;
$("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };

/* =========================================================
   7. АВТОРИЗАЦИЯ
   ========================================================= */
async function updateUser() {
  try {
    const { data } = await db.auth.getUser();
    user = data.user || null;
  } catch {
    user = null;
  }
  $("authButton").textContent = user ? "Выйти" : "Войти";
  $("myButton").classList.toggle("hidden", !user);
}

function showAuth(mode) {
  // mode: 'in' | 'up'
  const isIn = mode === "in";
  openModal(`
    <h2>${isIn ? "Вход" : "Регистрация"}</h2>
    <form id="authForm">
      <label>Электронная почта</label>
      <input id="email" type="email" required autocomplete="email">
      <label>Пароль (минимум 6 символов)</label>
      <input id="password" type="password" minlength="6" required autocomplete="current-password">
      <button class="accent" style="width:100%" type="submit">
        ${isIn ? "Войти" : "Создать аккаунт"}
      </button>
    </form>
    <p class="small" id="switchMode" style="cursor:pointer;text-decoration:underline;margin-top:12px">
      ${isIn ? "Нет аккаунта? Зарегистрироваться" : "Уже есть аккаунт? Войти"}
    </p>
    <div id="authError" class="small" style="color:#c33"></div>
  `);

  $("switchMode").onclick = () => showAuth(isIn ? "up" : "in");

  $("authForm").onsubmit = async e => {
    e.preventDefault();
    const email = $("email").value.trim();
    const password = $("password").value;
    const errBox = $("authError");
    errBox.textContent = "Подожди…";

    try {
      let result;
      if (isIn) {
        result = await db.auth.signInWithPassword({ email, password });
      } else {
        result = await db.auth.signUp({ email, password });
      }

      if (result.error) {
        errBox.textContent = "Ошибка: " + result.error.message;
        return;
      }

      // Если регистрация и нет сессии — значит нужно подтвердить email
      if (!isIn && !result.data.session) {
        errBox.textContent = "Проверь почту и подтверди регистрацию, затем войди.";
        return;
      }

      await updateUser();
      closeModal();
      await loadListings();
      showNotice(isIn ? "Ты вошёл в FAM!" : "Аккаунт создан!");
    } catch (err) {
      errBox.textContent = "Ошибка: " + err.message;
    }
  };
}

$("authButton").onclick = async () => {
  if (user) {
    await db.auth.signOut();
    user = null;
    onlyMine = false;
    $("heading").textContent = "Свежие объявления";
    await updateUser();
    await loadListings();
    showNotice("Ты вышел из аккаунта.");
  } else {
    showAuth("in");
  }
};

/* =========================================================
   8. СОЗДАНИЕ ОБЪЯВЛЕНИЯ
   ========================================================= */
$("addButton").onclick = () => {
  if (!user) { showAuth("in"); return; }

  openModal(`
    <h2>Новое объявление</h2>
    <form id="postForm">
      <label>Название</label>
      <input id="title" maxlength="80" required>
      <label>Категория</label>
      <select id="cat">
        <option>Вещи</option>
        <option>Услуги</option>
        <option>Творчество</option>
        <option>Учёба</option>
      </select>
      <label>Описание</label>
      <textarea id="description" maxlength="1000" rows="4" required></textarea>
      <label>Цена или обмен</label>
      <input id="price" maxlength="60" placeholder="Например: бесплатно" required>
      <button class="accent" style="width:100%" type="submit">Опубликовать</button>
    </form>
    <div id="postError" class="small" style="color:#c33"></div>
  `);

  $("postForm").onsubmit = async e => {
    e.preventDefault();
    const errBox = $("postError");
    errBox.textContent = "Публикуем…";

    const item = {
      user_id: user.id,
      title: $("title").value.trim(),
      category: $("cat").value,
      description: $("description").value.trim(),
      price_text: $("price").value.trim()
    };

    const { error } = await db.from("listings").insert(item);
    if (error) {
      errBox.textContent = "Не удалось: " + error.message;
      return;
    }

    closeModal();
    onlyMine = false;
    $("heading").textContent = "Свежие объявления";
    await loadListings();
    showNotice("Объявление опубликовано!");
  };
};

/* =========================================================
   9. МОИ ОБЪЯВЛЕНИЯ
   ========================================================= */
$("myButton").onclick = async () => {
  onlyMine = !onlyMine;
  $("heading").textContent = onlyMine ? "Мои объявления" : "Свежие объявления";
  await loadListings();
};

$("search").oninput = renderListings;
$("category").onchange = renderListings;

/* =========================================================
   10. ЗАГРУЗКА И РЕНДЕР
   ========================================================= */
async function loadListings() {
  setListingsText("Загрузка объявлений…");

  try {
    let query = db
      .from("listings")
      .select("id,user_id,title,category,description,price_text,created_at,status")
      .eq("status", "active")
      .order("created_at", { ascending: false })
      .limit(30);

    if (onlyMine && user) {
      query = query.eq("user_id", user.id);
    }

    const { data, error } = await query;

    if (error) {
      setListingsText("Ошибка загрузки: " + error.message);
      showNotice("Ошибка загрузки: " + error.message, true);
      return;
    }

    listings = data || [];
    renderListings();
  } catch (err) {
    setListingsText("Ошибка: " + err.message);
    showNotice("Ошибка: " + err.message, true);
  }
}

function renderListings() {
  const term = $("search").value.trim().toLowerCase();
  const category = $("category").value;

  const filtered = listings.filter(x =>
    (!category || x.category === category) &&
    (!term || (x.title + " " + x.description).toLowerCase().includes(term))
  );

  if (!filtered.length) {
    $("listings").innerHTML = '<div class="card">Объявлений пока нет. Будь первым!</div>';
    return;
  }

  $("listings").innerHTML = filtered.map(x => `
    <article class="card">
      <span class="pill">${escapeHTML(x.category)}</span>
      <h3>${escapeHTML(x.title)}</h3>
      <p>${escapeHTML(x.description)}</p>
      <div class="price">${escapeHTML(x.price_text)}</div>
      <div class="small">${new Date(x.created_at).toLocaleDateString("ru-RU")}</div>
      ${user && user.id === x.user_id
        ? `<button style="margin-top:12px" data-hide="${x.id}">Скрыть объявление</button>`
        : ""}
    </article>
  `).join("");

  // Делегирование событий — вместо inline onclick
  $("listings").querySelectorAll("[data-hide]").forEach(btn => {
    btn.onclick = () => hideListing(btn.getAttribute("data-hide"));
  });
}

async function hideListing(id) {
  if (!user) return;
  const { error } = await db
    .from("listings")
    .update({ status: "hidden" })
    .eq("id", id)
    .eq("user_id", user.id); // защита от чужого id

  if (error) {
    showNotice("Не удалось скрыть: " + error.message, true);
    return;
  }
  await loadListings();
  showNotice("Объявление скрыто.");
}

/* =========================================================
   11. СЛУШАТЕЛЬ АВТОРИЗАЦИИ
   ========================================================= */
db.auth.onAuthStateChange((event, session) => {
  user = session?.user ?? null;
  $("authButton").textContent = user ? "Выйти" : "Войти";
  $("myButton").classList.toggle("hidden", !user);
  if (!user) {
    onlyMine = false;
    $("heading").textContent = "Свежие объявления";
  }
});

/* =========================================================
   12. СТАРТ
   ========================================================= */
(async () => {
  try {
    await updateUser();
    await loadListings();
  } catch (err) {
    setListingsText("Ошибка старта: " + err.message);
    showNotice("Ошибка старта: " + err.message, true);
  }
})();
</script>
</body>
</html>
