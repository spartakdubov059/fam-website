name: FAM Qwen QA failure SQL contract
on:
  pull_request:
    paths:
      - 'tests/fixtures/fam-qa-failure/**'
      - '.github/workflows/fam-qa-failure-contract.yml'
      - 'supabase/migrations/**'
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reproduce and test lifecycle transition in a disposable local database
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres createdb fam_qa_failure_fixture
          cat tests/fixtures/fam-qa-failure/setup.sql \
            supabase/migrations/20261123001553_fam_qwen_lease_and_lifecycle.sql \
            tests/fixtures/fam-qa-failure/baseline.sql \
            tests/fixtures/fam-qa-failure/proposed.sql \
            tests/fixtures/fam-qa-failure/assertions.sql \
            supabase/migrations/20261123194000_fam_inspector_bounded_coder_enqueue.sql \
            supabase/migrations/20261123210000_fam_qwen_retry_scope_and_stale_queue.sql \
            tests/fixtures/fam-qa-failure/recovery.sql \
            supabase/migrations/20261123220000_fam_qwen_runtime_smoke_dedupe.sql \
            supabase/migrations/20261110163415_add_fam_agent_queue_health_rpc.sql \
            tests/fixtures/fam-qa-failure/pending-review.sql \
            | sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d fam_qa_failure_fixture
      - name: Remove fixture database
        if: always()
        run: sudo -u postgres dropdb --if-exists fam_qa_failure_fixture
