name: Moderation regression tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  moderation-tests:
    name: Russian content safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run moderation tests
        run: node --test tests/moderation/*.test.mjs tests/security/*.test.mjs
      - name: Run accumulated Qwen regression tests
        id: proposed_tests
        run: |
          set -euo pipefail
          tracked_tests=()
          while IFS= read -r -d '' file; do tracked_tests+=("$file"); done \
            < <(git ls-files -z -- tests/agent-proposed/)
          proposed_tests=()
          if (( ${#tracked_tests[@]} > 0 )); then
            for file in "${tracked_tests[@]}"; do
              case "$file" in
                tests/agent-proposed/*.test.mjs) proposed_tests+=("./$file") ;;
              esac
            done
          fi
          if (( ${#proposed_tests[@]} > 0 )); then
            node --test "${proposed_tests[@]}"
          fi
      - name: Check Qwen bridge client syntax
        run: node --check scripts/fam-agent-bridge.mjs
      - name: Check local Qwen model runner syntax
        run: node --check scripts/run-local-coder.mjs
      - name: Check local model HTTP client syntax
        run: node --check scripts/local-model-http.mjs
      - name: Check inline frontend JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const inlineScript = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[2])
            .find((script) => script.trim().length > 0);
          if (!inlineScript) throw new Error('No inline JavaScript found in index.html');
          fs.writeFileSync('/tmp/fam-inline-scripts.js', inlineScript);
          NODE
          node --check /tmp/fam-inline-scripts.js
