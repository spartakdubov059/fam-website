name: FAM Qwen runtime smoke
on:
  pull_request:
    paths:
      - '.github/workflows/fam-codex-developer.yml'
      - '.github/workflows/fam-qwen-runtime-smoke.yml'
permissions:
  contents: read
jobs:
  runtime-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned llama.cpp without weights or credentials
        env:
          LLAMA_CPP_COMMIT: 2a4daf0e08d6a9b6993ee0d4a9a3cfc35a6f405c
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_COMMIT"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON \
            -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DGGML_OPENMP=ON \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4
      - name: Simulate full runtime cache restored on a clean runner
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/llama.cpp/build/bin" "$RUNNER_TEMP/fam-smoke-runtime"
          rm -rf -- "$RUNNER_TEMP/llama.cpp"
          mkdir -p "$RUNNER_TEMP/llama.cpp/build"
          mv "$RUNNER_TEMP/fam-smoke-runtime" "$RUNNER_TEMP/llama.cpp/build/bin"
          SERVER="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"
          test -x "$SERVER"
          deps="$(ldd "$SERVER" 2>&1)"
          if grep -q 'not found' <<< "$deps"; then
            echo '::error::Restored runtime has unresolved shared libraries.'
            exit 1
          fi
      - name: Execute the production isolated-loader staging without downloading a model
        run: |
          set -euo pipefail
          # Extract only the exact staging block from the existing workflow.
          # No queue, secrets, weights, API calls or model inference are used.
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fam-codex-developer.yml').read_text()
          start = '          INFERENCE_HOME="/tmp/fam-inference-home"'
          end = '          sudo chmod 644 "$MODEL"'
          assert workflow.count(start) == 1 and workflow.count(end) == 1
          first = workflow.index(start)
          last = workflow.index(end, first)
          block = workflow[first:last]
          assert '"$INFERENCE_SERVER" --version' in block
          assert 'env -i' in block
          assert 'FAM_AGENT_WORKER_TOKEN' not in block and 'FAM_AGENT_BRIDGE_URL' not in block
          script = 'set -euo pipefail\nSERVER="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"\n'
          script += '\n'.join(line[10:] for line in block.splitlines()) + '\n'
          Path('/tmp/fam-qwen-loader-smoke.sh').write_text(script)
          PY
          bash /tmp/fam-qwen-loader-smoke.sh
          echo 'Isolated loader --version passed; model inference was not run.'
