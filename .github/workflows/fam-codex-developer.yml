name: FAM local AI developer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для бесплатного локального ИИ-разработчика FAM (до 3000 символов)"
        required: false
        type: string
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: fam-local-ai-developer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Локальная модель готовит исправление
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.actor == 'spartakdubov059')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.agent.outputs.has_patch }}
    steps:
      - name: Получить исходники FAM без GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: main
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"

      - name: Восстановить бесплатные веса модели из кэша
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4
        with:
          path: ${{ runner.temp }}/fam-model/qwen2.5-coder-7b-q4_k_m.gguf
          key: fam-qwen25-coder-7b-q4km-v1

      - name: Скачать бесплатную модель с лицензией Apache 2.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fam-model"
          MODEL="$RUNNER_TEMP/fam-model/qwen2.5-coder-7b-q4_k_m.gguf"
          if [[ ! -s "$MODEL" ]]; then
            curl --fail --location --retry 3 --retry-delay 3 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94b/qwen2.5-coder-7b-instruct-q4_k_m.gguf" \
              --output "$MODEL"
          fi
          test -s "$MODEL"

      - name: Собрать llama.cpp без GPU и стороннего API
        env:
          LLAMA_CPP_COMMIT: cd959bae99ff4bed22bef2604f45241c09bbb8c8
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_COMMIT"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DGGML_OPENMP=ON
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4

      - name: Запустить локальную модель и подготовить patch
        id: agent
        env:
          FAM_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/fam-model/qwen2.5-coder-7b-q4_k_m.gguf"
          SERVER="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"
          "$SERVER" -m "$MODEL" \
            --host 127.0.0.1 --port 8080 -c 16384 -t 4 -np 1 \
            > "$RUNNER_TEMP/fam-llama-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=false
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Локальный сервер модели завершился до готовности."
              tail -n 80 "$RUNNER_TEMP/fam-llama-server.log"
              exit 1
            fi
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Локальная модель не запустилась за отведённое время."
            tail -n 80 "$RUNNER_TEMP/fam-llama-server.log"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fam-agent"
          git rev-parse HEAD > "$RUNNER_TEMP/fam-agent-base.sha"
          node scripts/run-local-coder.mjs
          cp "$RUNNER_TEMP/fam-agent-base.sha" "$RUNNER_TEMP/fam-agent/base.sha"
          if [[ "$(node -e "const s=require(process.argv[1]); process.stdout.write(String(s.patch_available))" "$RUNNER_TEMP/fam-agent/summary.json")" == "true" ]]; then
            git apply --check "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          fi

      - name: Сохранить patch и отчёт модели
        if: always() && steps.agent.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: fam-local-agent-result
          path: ${{ runner.temp }}/fam-agent/
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Независимая проверка без модели и секретов
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      requires_approval: ${{ steps.safety.outputs.requires_approval }}
    steps:
      - name: Получить чистую основную ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: main
          persist-credentials: false

      - name: Скачать предложенный patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: fam-local-agent-result
          path: ${{ runner.temp }}/fam-agent

      - name: Проверить базовую ревизию и разрешённые файлы
        id: safety
        run: |
          set -euo pipefail
          EXPECTED_BASE_SHA="$(cat "$RUNNER_TEMP/fam-agent/base.sha")"
          ACTUAL_BASE_SHA="$(git rev-parse HEAD)"
          if [[ "$EXPECTED_BASE_SHA" != "$ACTUAL_BASE_SHA" ]]; then
            echo "::error::Основная ветка изменилась после генерации. Patch устарел; автоматическая публикация отменена."
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          node scripts/validate-local-agent-patch.mjs \
            "$RUNNER_TEMP/fam-agent/fam-agent.patch" \
            "$RUNNER_TEMP/fam-agent/summary.json" > "$RUNNER_TEMP/fam-agent/safety.json"
          node -e "const s=require(process.argv[1]); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'requires_approval='+String(s.requires_approval)+'\\n')" \
            "$RUNNER_TEMP/fam-agent/safety.json"
          git apply "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          mapfile -d '' changed_files < <(git diff --name-only -z HEAD)
          if (( ${#changed_files[@]} == 0 )); then
            echo "::error::Patch не содержит изменений."
            exit 1
          fi
          for file in "${changed_files[@]}"; do
            case "$file" in
              index.html|css/*|js/*|assets/*|docs/*|tests/*) ;;
              *)
                echo "::error::Запрещённый путь в patch: $file"
                exit 1
                ;;
            esac
          done
          has_behavior_code=false
          has_tests=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              index.html|js/*) has_behavior_code=true ;;
              tests/*) has_tests=true ;;
            esac
          done
          if [[ "$has_behavior_code" == "true" && "$has_tests" != "true" ]]; then
            echo "::error::Изменение HTML/JavaScript не содержит регрессионного теста."
            exit 1
          fi
          git diff --check HEAD

      - name: Установить Node.js для тестирования
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"

      - name: Выполнить полный набор регрессионных тестов
        run: node --test tests/moderation/*.test.mjs tests/security/*.test.mjs

      - name: Проверить синтаксис встроенного JavaScript
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[2])
            .filter((script) => script.trim().length > 0);
          if (scripts.length === 0) throw new Error("No inline JavaScript found in index.html");
          fs.writeFileSync("/tmp/fam-inline-scripts.js", scripts.join("\n;\n"));
          NODE
          node --check /tmp/fam-inline-scripts.js

  publish:
    name: Создать PR и опубликовать только безопасное исправление
    needs: [generate, verify]
    if: needs.generate.outputs.has_patch == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
      pages: write
    steps:
      - name: Получить чистую основную ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: main
          persist-credentials: false

      - name: Скачать patch и отчёт модели
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: fam-local-agent-result
          path: ${{ runner.temp }}/fam-agent

      - name: Создать PR и решить, нужна ли ручная проверка
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRES_APPROVAL: ${{ needs.verify.outputs.requires_approval }}
        run: |
          set -euo pipefail
          EXPECTED_BASE_SHA="$(cat "$RUNNER_TEMP/fam-agent/base.sha")"
          ACTUAL_BASE_SHA="$(git rev-parse HEAD)"
          if [[ "$EXPECTED_BASE_SHA" != "$ACTUAL_BASE_SHA" ]]; then
            echo "::error::main изменилась после тестов. Старый patch не публикуется."
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          git apply "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          git diff --check HEAD
          BRANCH="codex/fam-run-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "Propose verified low-risk FAM update"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null push --set-upstream origin "$BRANCH"
          SUMMARY="$(node -e "const s=require(process.argv[1]); process.stdout.write(String(s.summary||'Безопасное исправление FAM').slice(0,1600))" "$RUNNER_TEMP/fam-agent/summary.json")"
          {
            echo "## Локальный ИИ-разработчик FAM"
            echo
            echo "$SUMMARY"
            echo
            echo "- Модель: Qwen2.5-Coder-7B-Instruct-GGUF, запущена локально на временном GitHub runner."
            echo "- Внешние платные API не использовались."
            echo "- Patch прошёл независимые тесты и проверку безопасности в отдельном job этого запуска."
            echo "- Supabase, миграции, права доступа и аккаунты не менялись."
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Автоматическая публикация допускается только при низком риске и отсутствии признаков критических действий."
          } > "$RUNNER_TEMP/fam-agent-pr-body.md"
          if [[ "$REQUIRES_APPROVAL" == "true" ]]; then
            PR_URL="$(gh pr create --draft --base main --head "$BRANCH" --title "Предложение локального ИИ: исправление FAM" --body-file "$RUNNER_TEMP/fam-agent-pr-body.md")"
            echo "requires_approval=true" >> "$GITHUB_OUTPUT"
          else
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Автоисправление FAM после тестов" --body-file "$RUNNER_TEMP/fam-agent-pr-body.md")"
            echo "requires_approval=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Дождаться проверок PR и объединить низкорисковое исправление
        if: steps.pr.outputs.requires_approval == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          BRANCH_SHA="$(git rev-parse HEAD)"
          gh workflow run .github/workflows/moderation-regression.yml --ref "$BRANCH"
          TEST_RUN_ID=""
          for attempt in $(seq 1 60); do
            TEST_RUN_ID="$(gh run list --workflow .github/workflows/moderation-regression.yml --branch "$BRANCH" --limit 20 --json databaseId,headSha,event --jq ".[] | select(.headSha == \"$BRANCH_SHA\" and .event == \"workflow_dispatch\") | .databaseId" | head -n 1)"
            [[ -n "$TEST_RUN_ID" ]] && break
            sleep 5
          done
          if [[ -z "$TEST_RUN_ID" ]]; then
            echo "::error::Не найден отдельный запуск регрессионных тестов для ветки агента."
            exit 1
          fi
          gh run watch "$TEST_RUN_ID" --exit-status --interval 10
          TEST_CONCLUSION="$(gh run view "$TEST_RUN_ID" --json conclusion --jq '.conclusion')"
          if [[ "$TEST_CONCLUSION" != "success" ]]; then
            echo "::error::Независимый CI не прошёл: $TEST_CONCLUSION"
            exit 1
          fi
          gh pr merge "$PR_URL" --squash --delete-branch
          MERGE_SHA=""
          for attempt in $(seq 1 12); do
            MERGE_SHA="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // empty')"
            [[ -n "$MERGE_SHA" ]] && break
            sleep 5
          done
          if [[ -z "$MERGE_SHA" ]]; then
            echo "::error::PR объединён, но merge commit не удалось подтвердить."
            exit 1
          fi
          echo "Merged commit: $MERGE_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
          BUILD_STATUS=""
          BUILD_COMMIT=""
          for attempt in $(seq 1 120); do
            BUILD_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            BUILD_STATUS="$(jq -r '.status // empty' <<< "$BUILD_JSON")"
            BUILD_COMMIT="$(jq -r '.commit // empty' <<< "$BUILD_JSON")"
            if [[ "$BUILD_STATUS" == "errored" ]]; then
              echo "::error::GitHub Pages build завершился с ошибкой."
              exit 1
            fi
            if [[ "$BUILD_STATUS" == "built" && "$BUILD_COMMIT" == "$MERGE_SHA" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$BUILD_STATUS" != "built" || "$BUILD_COMMIT" != "$MERGE_SHA" ]]; then
            echo "::error::Не удалось подтвердить GitHub Pages build для merge commit $MERGE_SHA."
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 \
            --retry-all-errors --output /tmp/fam-production.html \
            "https://spartakdubov059.github.io/fam-website/"
          grep -qi "<html" /tmp/fam-production.html
          echo "GitHub Pages deployment succeeded for $MERGE_SHA; production HTTP response verified."

      - name: Сохранить отчёт о PR
        if: always()
        run: |
          echo "Результат локального ИИ-разработчика FAM:"
          echo "PR: ${{ steps.pr.outputs.pr_url }}"
          echo "Требуется ручное разрешение: ${{ steps.pr.outputs.requires_approval }}"
