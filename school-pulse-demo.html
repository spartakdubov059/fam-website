<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0F1014">
  <title>FAM — Школьный пульс (демо)</title>
  <link rel="stylesheet" href="./school-pulse.css">
  <style>
    :root{--bg:#0F1014;--surface:#1A1C22;--text:#F5F6F8;--muted:#AEB3C0;--border:#2A2D36;--violet:#8B5CF6;--lime:#C8F542}
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}
    .demo-frame{max-width:960px;margin:0 auto;padding:22px 18px 60px}
    .demo-notice{font-size:12px;background:#242634;border:1px solid #46495a;color:var(--muted);border-radius:16px;padding:12px 15px;margin:10px 0 26px}
    .demo-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
    .demo-hero b{font-size:24px;letter-spacing:-.06em}.demo-hero b span{color:var(--lime)}
    .demo-tag{font-size:10px;font-weight:800;padding:6px 9px;border:1px solid #454855;border-radius:20px}
    .hidden{display:none!important}
    button,input,textarea,select{font:inherit}
    .pulse-grid{margin:12px 0}
  </style>
</head>
<body>
  <div class="demo-frame">
    <div class="demo-hero"><b>FAM<span>.</span></b><span class="demo-tag">ПРОТОТИП</span></div>
    <p class="demo-notice"><strong>Это демонстрация дизайна.</strong> Все новости, опросы и результаты вымышлены. Голоса не записываются и не передаются в базу данных.</p>
    <section id="schoolPulse" class="school-pulse hidden" aria-labelledby="pulseTitle">
      <div class="pulse-header"><div>
        <span class="pulse-eyebrow">СВОИ. СВОЯ ШКОЛА.</span>
        <h1 class="pulse-title" id="pulseTitle">Школьный пульс ✦</h1>
        <p class="pulse-subtitle">Новости и голосования рядом</p>
      </div><button type="button" class="pulse-refresh" id="pulseRefreshBtn">Обновить</button></div>
      <div class="pulse-grid" id="pulseGrid" aria-live="polite"></div>
      <p class="pulse-meta" id="pulseStatus">Пример школьной ленты</p>
      <details id="pulseAdmin" class="pulse-admin hidden"><summary>Для администраторов</summary></details>
    </section>
  </div>
  <script src="./school-pulse.js"></script>
  <script>
    (() => {
      const pollId="8b07e0b4-4fd3-4a95-9715-7cdac57d22b1";
      let vote=null;
      const feed=()=>({
        announcements:[
          {id:"sample-news",title:"Неделя школьных проектов",body:"Выставка идей, мастер-классы и новые знакомства. Подробности скоро появятся в школьной афише.",kind:"news",published_at:"2026-11-13"},
          {id:"sample-important",title:"Предложи свою идею",body:"Хочешь изменить что-то в школе? Отправь предложение в «Почту идей» через профиль FAM.",kind:"important",published_at:"2026-11-13"}
        ],
        polls:[{
          id:pollId,question:"Какой новый формат активности вам интереснее?",
          options:["Творческие мастерские","Клуб настольных игр","Школьные квизы"],
          closes_at:"2027-12-01T20:00:00Z",total_votes:vote===null?11:12,
          my_vote:vote,counts:vote===null?[4,5,2]:[4+(vote===0?1:0),5+(vote===1?1:0),2+(vote===2?1:0)]
        }]
      });
      const fakeClient={
        rpc:async(name,args)=>{
          if(name==="fam_pulse_feed")return {data:feed(),error:null};
          if(name==="fam_vote_school_poll") {
            if(vote!==null)return {data:false,error:null};
            vote=args.p_choice_index;return {data:true,error:null};
          }
          return {data:null,error:new Error("demo_only")};
        }
      };
      const pulse=window.FAMSchoolPulse.mount({
        sb:fakeClient,
        getViewer:()=>({id:"demo-account",school_id:"demo-school",role:"student"}),
        notify:message=>window.alert(message)
      });
      if(pulse)pulse.refresh();
    })();
  </script>
</body>
</html>
