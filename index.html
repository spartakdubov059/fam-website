<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAM — Свои рядом</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0F1014; --surface: #1A1C22; --surface-hover: #23262E;
      --accent: #D4D8E3; --text: #F5F6F8; --muted: #7A7E8A;
      --border: #2A2D36; --danger: #FF6B6B; --success: #6BCB9B;
      --gradient: linear-gradient(135deg, #C8CDD8, #8B8F9A, #C8CDD8);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; line-height: 1.5; }
    .hidden { display: none !important; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; transition: all 0.2s; }
    
    .header { position: sticky; top: 0; z-index: 10; background: rgba(15,16,20,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; gap: 10px; align-items: center; color: var(--text); text-decoration: none; }
    .logo-mark { width: 36px; height: 36px; background: var(--gradient); color: var(--bg); border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 16px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .header-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: white; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); overflow: hidden; }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .main-nav { position: sticky; top: 60px; z-index: 9; background: rgba(15,16,20,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.04); }
    .nav-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; }
    .nav-tab { background: none; border: none; color: var(--muted); padding: 8px 4px; border-radius: 8px; font-weight: 600; font-size: 12px; text-align: center; }
    .nav-tab.active { background: rgba(200,205,216,0.12); color: var(--text); }
    
    .button { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; }
    .button-primary { background: var(--accent); color: var(--bg); }
    .button-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .button-danger { background: var(--danger); color: white; }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }
    .button-small { padding: 6px 10px; font-size: 11px; border-radius: 6px; }
    
    main { max-width: 1100px; margin: 0 auto; padding: 16px 12px 80px; }
    
    .carousel-container { margin: 10px 0 20px; }
    .carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
    .carousel::-webkit-scrollbar { display: none; }
    .carousel-card { flex: 0 0 100%; scroll-snap-align: start; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; position: relative; background: var(--surface); border: 1px solid var(--border); }
    .carousel-card img { width: 100%; height: 100%; object-fit: cover; }
    .carousel-event { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; }
    
    .listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { display: flex; flex-direction: column; position: relative; }
    .card-img-wrap { width: 100%; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #2A2D36, #1A1C22); }
    .card-info { padding: 8px 2px 0; display: flex; flex-direction: column; flex-grow: 1; }
    .card-price { font-weight: 800; font-size: 14px; margin-bottom: 2px; }
    .card-title { font-size: 12px; margin: 0 0 4px; line-height: 1.3; }
    .card-cat { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; }
    .card-btn { width: 100%; padding: 6px; font-size: 11px; margin-top: auto; }
    
    .favorite-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: none; color: white; font-size: 16px; display: grid; place-items: center; z-index: 2; cursor: pointer; }
    .favorite-btn.active { color: #FF6B6B; }
    
    .profile-box { background: var(--surface); padding: 16px; border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .profile-email { word-break: break-all; font-size: 13px; margin: 0 0 4px; }
    
    .idea-card { background: var(--bg); padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); }
    .idea-status { font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
    .status-done { background: rgba(107,203,155,0.15); color: var(--success); }
    .status-rejected { background: rgba(255,107,107,0.15); color: var(--danger); }
    .status-work { background: rgba(240,193,75,0.15); color: #F0C14B; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal.open { display: flex; }
    .modal-content { background: var(--surface); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; }
    
    .stars { display: flex; gap: 6px; font-size: 24px; cursor: pointer; }
    .star { color: var(--muted); }
    .star.active { color: #F0C14B; }
    
    .fab { position: fixed; bottom: 16px; right: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--gradient); color: var(--bg); font-size: 22px; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(200,205,216,0.3); border: none; z-index: 20; font-weight: 900; }
    @media(min-width: 800px) { .fab { display: none; } }
    
    .ai-hint { font-size: 11px; color: var(--muted); margin-bottom: 10px; padding: 10px; border-radius: 8px; border: 1px solid rgba(102,126,234,0.2); background: rgba(102,126,234,0.05); }
    .ai-hint a { color: var(--accent); cursor: pointer; font-weight: 600; }
    
    .avatar-upload { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .avatar-preview { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: grid; place-items: center; font-size: 24px; font-weight: 800; color: white; overflow: hidden; flex-shrink: 0; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    
    .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="document.querySelector('[data-tab=board]').click(); return false;"><div class="logo-mark">F</div><div><b style="font-size:14px;">FAM</b></div></a>
    <div class="header-actions">
      <button class="button button-secondary button-small hidden" id="myListingsBtn">Мои</button>
      <button class="button button-primary button-small" id="authBtn">Войти</button>
      <div class="header-avatar hidden" id="headerAvatar" onclick="document.querySelector('[data-tab=profile]').click()"></div>
    </div>
  </div>
</header>

<nav class="main-nav">
  <div class="nav-inner">
    <button class="nav-tab active" data-tab="board">Доска</button>
    <button class="nav-tab" data-tab="favorites">Избранное</button>
    <button class="nav-tab" data-tab="messages">Чат</button>
    <button class="nav-tab" data-tab="profile">Профиль</button>
  </div>
</nav>

<main>
  <section id="boardSection">
    <div class="carousel-container"><div class="carousel" id="bannerCarousel"></div></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 16px 0 8px;">
      <h2 style="margin:0; font-size:18px; font-weight:800;">Объявления</h2>
      <input type="search" id="searchInput" placeholder="Поиск..." class="form-control" style="width:140px; padding:6px 10px; font-size:12px;">
    </div>
    <div style="overflow-x:auto; display:flex; gap:6px; padding-bottom:8px; margin-bottom:8px;">
      <button class="button button-secondary cat-btn active" data-cat="Все" style="padding:5px 10px; font-size:11px;">Все</button>
      <button class="button button-secondary cat-btn" data-cat="Вещи" style="padding:5px 10px; font-size:11px;">Вещи</button>
      <button class="button button-secondary cat-btn" data-cat="Услуги" style="padding:5px 10px; font-size:11px;">У
