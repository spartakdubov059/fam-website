name: FAM coder QA PostgreSQL integration

on:
  pull_request:
    paths:
      - "supabase/migrations/20261113095000_record_coder_completion_after_qa.sql"
      - "supabase/migrations/20261113103000_preserve_qa_gate_with_bounded_retries.sql"
      - "tests/sql/fam-agent-coder-qa-*"
      - ".github/workflows/fam-agent-coder-qa-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coder-qa-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fam_coder_qa_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fam_coder_qa_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: fam_coder_qa_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Create isolated queue fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-qa-bootstrap.sql
      - name: Apply QA completion migration to PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113095000_record_coder_completion_after_qa.sql
      - name: Apply final bounded-retry and QA gate migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113103000_preserve_qa_gate_with_bounded_retries.sql
      - name: Verify completion, PR metadata and grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-qa-assert.sql
