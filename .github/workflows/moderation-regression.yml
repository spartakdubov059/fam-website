name: Moderation regression tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  moderation-tests:
    name: Russian content safety tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run moderation tests
        run: node --test tests/moderation/*.test.mjs tests/security/*.test.mjs
      - name: Check Qwen bridge client syntax
        run: node --check scripts/fam-agent-bridge.mjs
      - name: Check local Qwen model runner syntax
        run: node --check scripts/run-local-coder.mjs
      - name: Check local model HTTP client syntax
        run: node --check scripts/local-model-http.mjs
      - name: Check inline frontend JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const inlineScript = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[2])
            .find((script) => script.trim().length > 0);
          if (!inlineScript) throw new Error('No inline JavaScript found in index.html');
          fs.writeFileSync('/tmp/fam-inline-scripts.js', inlineScript);
          NODE
          node --check /tmp/fam-inline-scripts.js

      - name: Checkout trusted approval verifier from the base commit
        if: github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'codex/fam-run-')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base-${{ github.run_id }}
          persist-credentials: false
      - name: Require owner approval for the current agent PR revision
        if: github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'codex/fam-run-')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_BASE_DIR: trusted-base-${{ github.run_id }}
        run: node "$TRUSTED_BASE_DIR/scripts/verify-agent-pr-owner-approval.mjs"
