name: FAM RU SDK compatibility (staging only)

on:
  push:
    branches: ["migration/yandex-cloud", "codex/fam-ru-offline-safety-review", "codex/fam-ru-port-next", "codex/fam-ru-photo-access-guard"]
    paths:
      - "ru-migration/compat/**"
      - "ru-migration/app/backend/**"
      - "ru-migration/app/web/**"
      - "ru-migration/deploy/**"
      - ".github/workflows/fam-ru-sdk-compat.yml"
  pull_request:
    branches: ["migration/yandex-cloud"]
    paths:
      - "ru-migration/compat/**"
      - "ru-migration/app/backend/**"
      - "ru-migration/app/web/**"
      - "ru-migration/deploy/**"
      - ".github/workflows/fam-ru-sdk-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-ru-sdk-compat
  cancel-in-progress: true

jobs:
  sdk-compat:
    name: Installed SDK & Sharp smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify checked-out backend source integrity and syntax
        shell: bash
        run: |
          set -euo pipefail
          path=ru-migration/app/backend/repositories/ydb-listings.mjs
          expected=$(git rev-parse "HEAD:$path")
          actual=$(git hash-object --no-filters "$path")
          printf 'YDB repository blob expected=%s actual=%s\n' "$expected" "$actual"
          test "$expected" = "$actual"
          while IFS= read -r -d '' file; do
            if ! node --check "$file" > "$RUNNER_TEMP/fam-ru-syntax.log" 2>&1; then
              printf 'Invalid syntax in tracked module: %s\n' "$file" >&2
              exit 1
            fi
          done < <(git ls-files -z -- 'ru-migration/app/backend/*.mjs' 'ru-migration/compat/*.mjs')
          echo FAM_RU_TRACKED_MODULE_SYNTAX_PASS
      - name: Test Yandex Functions package composition
        run: node --test ru-migration/deploy/package-yandex-function.test.mjs
      - name: Build and verify the direct-upload Yandex Cloud Functions package
        run: node ru-migration/deploy/package-yandex-function.mjs "$RUNNER_TEMP/fam-ru-yandex-function.zip"
      - name: Install and smoke-test packaged HTTP and timer entrypoints
        run: node ru-migration/compat/smoke-yandex-function-package.mjs "$RUNNER_TEMP/fam-ru-yandex-function.zip"
      - name: Install locked compatibility dependencies
        run: npm ci --prefix ru-migration/compat --no-audit --no-fund
      - name: Install and test isolated FAM RU backend
        run: npm ci --prefix ru-migration/app/backend --no-audit --no-fund && npm test --prefix ru-migration/app/backend
      - name: Test synthetic migration package runner
        run: node --test ru-migration/compat/synthetic-migration-runner.test.mjs
      - name: Validate systemd timer schedules and service references
        run: node ru-migration/compat/verify-systemd-timers.mjs
      - name: Test actual native image processing and SDK exports
        run: npm run --prefix ru-migration/compat check
      - name: Save compatibility lockfile for review
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: fam-ru-sdk-package-lock
          path: ru-migration/compat/package-lock.json
          retention-days: 7
