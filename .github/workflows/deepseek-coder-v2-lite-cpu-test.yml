name: FAM DeepSeek Coder V2 Lite free CPU verification

on:
  push:
    branches:
      - ai/deepseek-coder-v2-lite-cpu-test
    paths:
      - ".github/workflows/deepseek-coder-v2-lite-cpu-test.yml"

permissions:
  contents: read

concurrency:
  group: fam-deepseek-v2-lite-cpu-verification
  cancel-in-progress: false

jobs:
  verify-model:
    name: DeepSeek Coder V2 Lite — same FAM coding task
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"

      - name: Test FAM patch safety helpers
        run: |
          set -euo pipefail
          node --test tests/security/local-model-json.test.mjs
          node --test tests/security/local-model-patch.test.mjs

      - name: Download and verify DeepSeek Coder V2 Lite Q4_K_M
        env:
          MODEL_SHA256: 38bc76f3326b49b4d81d1027d092bf7ce5b4ed2de4136d1d2e7e6347c3ec8376
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fam-model"
          MODEL="$RUNNER_TEMP/fam-model/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
            "https://huggingface.co/second-state/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/7d0d798/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf" \
            --output "$MODEL"
          actual_size="$(stat -c '%s' "$MODEL")"
          actual_sha="$(sha256sum "$MODEL" | awk '{print $1}')"
          if (( actual_size < 10000000000 )) || [[ "$actual_sha" != "$MODEL_SHA256" ]]; then
            echo "::error::DeepSeek model size or SHA-256 verification failed."
            exit 1
          fi
          echo "Verified DeepSeek Coder V2 Lite Q4_K_M: $actual_size bytes"
          df -h "$RUNNER_TEMP"

      - name: Build pinned llama.cpp with CPU support
        env:
          LLAMA_CPP_COMMIT: 2a4daf0e08d6a9b6993ee0d4a9a3cfc35a6f405c
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_COMMIT"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DGGML_OPENMP=ON
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4

      - name: Start DeepSeek locally on CPU
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/fam-model/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf"
          SERVER="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"
          "$SERVER" -m "$MODEL" \
            --host 127.0.0.1 --port 8080 -c 16384 -t 4 -np 1 \
            --temp 0.1 --top-p 0.95 --top-k 40 \
            > "$RUNNER_TEMP/fam-llama-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/fam-llama-server.pid"
          READY=false
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/fam-llama-server.pid")" 2>/dev/null; then
              echo "::error::llama-server stopped before becoming ready."
              tail -n 100 "$RUNNER_TEMP/fam-llama-server.log"
              exit 1
            fi
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::DeepSeek did not start within 15 minutes."
            tail -n 100 "$RUNNER_TEMP/fam-llama-server.log"
            exit 1
          fi

      - name: Run the same isolated FAM coding task
        env:
          FAM_MODEL_ID: second-state/DeepSeek-Coder-V2-Lite-Instruct
          FAM_TASK: "Исправь воспроизводимый дефект функции normalizeSearchInput в tests/fixtures/qwen-model-benchmark.mjs. Сейчас она приводит строку к нижнему регистру и обрезает края, но оставляет повторные пробелы, табуляции и переводы строк внутри. Сверни любую последовательность Unicode whitespace в один обычный пробел, сохрани нижний регистр, trim и сигнатуру функции. Регрессионные тесты находятся в tests/fixtures/qwen-model-benchmark.test.mjs. Измени только tests/fixtures/qwen-model-benchmark.mjs, не меняй тест и остальные файлы. Подготовь минимальный patch с доказательством причины."
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/fam-deepseek-output"
          mkdir -p "$OUTPUT_ROOT"
          START_TIME="$(date +%s)"
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
          RUNNER_TEMP="$OUTPUT_ROOT" \
          FAM_MODEL_ID="$FAM_MODEL_ID" \
          FAM_TASK="$FAM_TASK" \
            node scripts/run-local-coder.mjs
          END_TIME="$(date +%s)"
          echo "$((END_TIME - START_TIME))" > "$OUTPUT_ROOT/inference-seconds.txt"
          test -s "$OUTPUT_ROOT/fam-agent/summary.json"

      - name: Validate the patch and run independent tests
        id: qa
        if: always()
        env:
          MODEL_LABEL: deepseek-coder-v2-lite
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/fam-deepseek-output"
          SUMMARY="$OUTPUT_ROOT/fam-agent/summary.json"
          PATCH="$OUTPUT_ROOT/fam-agent/fam-agent.patch"
          QA_STATUS="not_run_no_patch"
          PATCH_STATUS="false"
          SELECTED_FILES="none"
          if [[ ! -s "$SUMMARY" ]]; then
            QA_STATUS="model_or_inference_failed"
          else
            PATCH_STATUS="$(node -e "const s=require(process.argv[1]); process.stdout.write(String(s.patch_available === true))" "$SUMMARY")"
            SELECTED_FILES="$(node -e "const s=require(process.argv[1]); process.stdout.write((s.affected_files || []).join(',') || 'none')" "$SUMMARY")"
            if [[ "$PATCH_STATUS" == "true" ]]; then
              node scripts/validate-local-agent-patch.mjs "$PATCH" "$SUMMARY"
              node --input-type=module - "$PATCH" <<'NODE'
          import { readFileSync } from "node:fs";
          const patch = readFileSync(process.argv[2], "utf8");
          const paths = [...patch.matchAll(/^diff --git a\/(.+?) b\/(.+?)\s*$/gm)].map((m) => m[1]);
          if (paths.length !== 1 || paths[0] !== "tests/fixtures/qwen-model-benchmark.mjs") {
            throw new Error("Benchmark patch changed paths outside the one expected fixture: " + paths.join(", "));
          }
          NODE
              git apply --check "$PATCH"
              git apply "$PATCH"
              if node --test tests/fixtures/qwen-model-benchmark.test.mjs && \
                 node --test tests/moderation/*.test.mjs tests/security/*.test.mjs; then
                QA_STATUS="passed"
              else
                QA_STATUS="failed"
              fi
            fi
          fi
          node --input-type=module - "$SUMMARY" "$OUTPUT_ROOT/benchmark-result.json" "$QA_STATUS" "$PATCH_STATUS" "$SELECTED_FILES" "$MODEL_LABEL" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [summaryPath, resultPath, qa, patchAvailable, selectedFiles, label] = process.argv.slice(2);
          let report = null;
          try { report = JSON.parse(readFileSync(summaryPath, "utf8")); } catch {}
          let elapsed = null;
          try { elapsed = Number(readFileSync(process.env.RUNNER_TEMP + "/fam-deepseek-output/inference-seconds.txt", "utf8").trim()); } catch {}
          writeFileSync(resultPath, JSON.stringify({
            label, model: report?.model ?? label, outcome: report?.outcome ?? "inference_failed",
            finding_status: report?.finding_status ?? "unknown",
            patch_available: patchAvailable === "true", qa_status: qa,
            inference_seconds: Number.isFinite(elapsed) ? elapsed : null,
            affected_files: selectedFiles, summary: report?.summary ?? "No model report was produced."
          }, null, 2) + "\n");
          NODE
          {
            echo "### $MODEL_LABEL"
            echo "- Patch: $PATCH_STATUS"
            echo "- Independent QA: $QA_STATUS"
            echo "- Selected files: $SELECTED_FILES"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$QA_STATUS" != "passed" ]]; then
            echo "::error::Candidate requires a generated patch that passes independent tests; QA status was $QA_STATUS."
            exit 1
          fi

      - name: Stop local model server
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/fam-llama-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/fam-llama-server.pid")" 2>/dev/null || true
          fi

      - name: Save DeepSeek benchmark report and patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: deepseek-coder-v2-lite-cpu-result
          path: |
            \${{ runner.temp }}/fam-deepseek-output/benchmark-result.json
            \${{ runner.temp }}/fam-deepseek-output/fam-agent/summary.json
            \${{ runner.temp }}/fam-deepseek-output/fam-agent/fam-agent.patch
          if-no-files-found: warn
          retention-days: 3
