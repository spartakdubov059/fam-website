name: Moderation regression tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  moderation-tests:
    name: Russian content safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run moderation tests
        run: node --test tests/moderation/*.test.mjs tests/security/*.test.mjs
      - name: Check inline frontend JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const inlineScript = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[2])
            .find((script) => script.trim().length > 0);
          if (!inlineScript) throw new Error('No inline JavaScript found in index.html');
          fs.writeFileSync('/tmp/fam-inline-scripts.js', inlineScript);
          NODE
          node --check /tmp/fam-inline-scripts.js
