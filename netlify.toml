[build]
  # FAM is a static site served directly from the repository root.
  publish = "."

# Revalidate HTML on each visit so browsers and edge caches do not keep
# an outdated copy of the application shell after a production deploy.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
