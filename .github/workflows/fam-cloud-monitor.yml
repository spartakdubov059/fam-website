name: FAM cloud site monitor

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fam-cloud-site-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    name: Read-only site and CI smoke checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout monitoring code without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"

      - name: Check production pages and recent main workflows
        run: node scripts/run-fam-cloud-monitor.mjs

  mobile-performance:
    name: Mobile Lighthouse lab audit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '7 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout monitor code without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"

      - name: Run pinned Lighthouse mobile audit
        id: lighthouse
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npx --yes lighthouse@13.6.0 \
              https://spartakdubov059.github.io/fam-website/ \
              --form-factor=mobile \
              --throttling-method=simulate \
              --only-categories=performance \
              --output=json \
              --output=html \
              --output-path="$RUNNER_TEMP/fam-lighthouse" \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
              --quiet; then
              exit 0
            fi
            if [[ "$attempt" == "1" ]]; then
              echo "::warning::Lighthouse could not launch Chrome; retrying once."
              sleep 2
            fi
          done
          exit 1

      - name: Save the full Lighthouse report for investigation
        if: always() && steps.lighthouse.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: fam-mobile-lighthouse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fam-lighthouse.report.html
            ${{ runner.temp }}/fam-lighthouse.report.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish normalized metrics and fail on poor lab thresholds
        run: node scripts/run-fam-lighthouse-report.mjs "$RUNNER_TEMP/fam-lighthouse.report.json"
