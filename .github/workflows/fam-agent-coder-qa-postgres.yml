name: FAM coder QA PostgreSQL integration

on:
  pull_request:
    paths:
      - "supabase/migrations/20261113095000_record_coder_completion_after_qa.sql"
      - "supabase/migrations/20261113100000_fam_agent_bounded_coder_retries.sql"
      - "supabase/migrations/20261113103000_preserve_qa_gate_with_bounded_retries.sql"
      - "supabase/migrations/*fam_agent_coder_task_cooldown.sql"
      - "supabase/migrations/*fam_agent_coder_context.sql"
      - "tests/sql/fam-agent-coder-qa-*"
      - ".github/workflows/fam-agent-coder-qa-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coder-qa-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fam_coder_qa_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fam_coder_qa_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: fam_coder_qa_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Create isolated queue fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-qa-bootstrap.sql
      - name: Install baseline coder bridge functions in the fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111153059_fam_agent_coder_queue_bridge.sql
      - name: Apply QA completion migration to PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113095000_record_coder_completion_after_qa.sql
      - name: Fetch PR #74 bounded retry migration source
        run: |
          git fetch --no-tags --depth=1 origin refs/pull/74/head:refs/remotes/pull/74/head
          git show refs/remotes/pull/74/head:supabase/migrations/20261113100000_fam_agent_bounded_coder_retries.sql > /tmp/fam-agent-bounded-coder-retries.sql
          printf 'Tested PR #74 head: `%s`\n' "$(git rev-parse refs/remotes/pull/74/head)" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply PR #74 bounded retry migration in version order
        run: psql -v ON_ERROR_STOP=1 -f /tmp/fam-agent-bounded-coder-retries.sql
      - name: Apply final bounded-retry and QA gate migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113103000_preserve_qa_gate_with_bounded_retries.sql
      - name: Apply producer cooldown migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113211712_fam_agent_coder_task_cooldown.sql
      - name: Apply bounded coder context migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113221844_fam_agent_coder_context.sql
      - name: Verify completion, PR metadata and grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/fam-agent-coder-qa-assert.sql
