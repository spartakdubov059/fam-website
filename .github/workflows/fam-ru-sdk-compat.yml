name: FAM RU SDK compatibility (staging only)

on:
  push:
    branches: ["migration/yandex-cloud"]
    paths:
      - "ru-migration/compat/**"
      - "ru-migration/app/backend/**"
      - "ru-migration/app/web/**"
      - ".github/workflows/fam-ru-sdk-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-ru-sdk-compat
  cancel-in-progress: true

jobs:
  sdk-compat:
    name: Installed SDK & Sharp smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked compatibility dependencies
        run: npm ci --prefix ru-migration/compat --no-audit --no-fund
      - name: Install and test isolated FAM RU backend
        run: npm ci --prefix ru-migration/app/backend --no-audit --no-fund && npm test --prefix ru-migration/app/backend
      - name: Test actual native image processing and SDK exports
        run: npm run --prefix ru-migration/compat check
      - name: Save compatibility lockfile for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fam-ru-sdk-package-lock
          path: ru-migration/compat/package-lock.json
          retention-days: 7
