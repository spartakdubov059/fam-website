name: FAM local AI developer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fam-codex-developer.yml"
      - ".github/prompts/fam-codex-developer.md"
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "docs/**"
      - "tests/**"
      - "scripts/run-local-coder.mjs"
      - "scripts/local-model-http.mjs"
      - "scripts/fam-agent-bridge.mjs"
      - "supabase/functions/fam-agent-coder-bridge/**"
      - "scripts/validate-local-agent-patch.mjs"
      - "scripts/fam-agent-report.mjs"
      - "scripts/render-fam-agent-report.mjs"
      - "tests/security/fam-local-agent.test.mjs"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: fam-local-ai-developer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Локальная модель готовит исправление
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || github.actor == 'spartakdubov059' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.agent.outputs.has_patch }}
      fam_task_id: ${{ steps.coder-queue.outputs.task_id }}
    steps:
      - name: Получить исходники FAM без GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: main
          persist-credentials: false

      - name: Получить одно безопасное задание из очереди до долгих шагов
        id: coder-queue
        env:
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
        run: node scripts/fam-agent-bridge.mjs claim

      - name: Проверить настройки затрат до сборки модели
        id: preflight
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_OS}; repository: ${GITHUB_REPOSITORY}; event: ${GITHUB_EVENT_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Проверка AI-runner разрешена только на main."
            exit 1
          fi
          if [[ "${{ steps.coder-queue.outputs.claimed }}" == "false" ]]; then
            echo "schedule_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Разрешённой задачи нет; загрузка модели и сборка пропущены."
            exit 0
          fi
          echo "schedule_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        if: steps.preflight.outputs.schedule_enabled == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"
      - name: Восстановить бесплатные веса модели из кэша
        if: steps.preflight.outputs.schedule_enabled == 'true'
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4
        with:
          path: ${{ runner.temp }}/fam-model/Qwen3.8-27B-64L-IQ2_XS.gguf
          key: fam-qwen38-27b-iq2xs-v1

      - name: Восстановить сборку llama.cpp из кэша
        if: steps.preflight.outputs.schedule_enabled == 'true'
        id: llama-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4
        with:
          path: ${{ runner.temp }}/llama.cpp/build/bin/llama-server
          key: fam-llama-cpu-${{ runner.os }}-${{ runner.arch }}-2a4daf0e08d6a9b6993ee0d4a9a3cfc35a6f405c-v1

      - name: Скачать бесплатную модель с лицензией Apache 2.0
        if: steps.preflight.outputs.schedule_enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fam-model"
          MODEL="$RUNNER_TEMP/fam-model/Qwen3.8-27B-64L-IQ2_XS.gguf"
          if [[ ! -s "$MODEL" ]]; then
            curl --fail --location --retry 3 --retry-delay 3 \
              "https://huggingface.co/sammyblues/Qwen3.8-27B-IQ2_XS-GGUF/resolve/0466a972ecb7e0711efd814b6f2e3856b4b4027b/Qwen3.8-27B-64L-IQ2_XS.gguf" \
              --output "$MODEL"
          fi
          verify_model() {
            [[ -s "$MODEL" ]] || return 1
            local actual_size actual_sha
            actual_size="$(stat -c '%s' "$MODEL")"
            (( actual_size >= 8500000000 )) || return 1
            actual_sha="$(sha256sum "$MODEL" | awk '{print $1}')"
            [[ "$actual_sha" == "eaeb705c72e5b7a55268f9f9a84b855ec3c1dd1b1f8c414cfc2d9ea52ad9eb23" ]]
          }
          if ! verify_model; then
            rm -f "$MODEL"
            curl --fail --location --retry 3 --retry-delay 5 --retry-all-errors \
              "https://huggingface.co/sammyblues/Qwen3.8-27B-IQ2_XS-GGUF/resolve/0466a972ecb7e0711efd814b6f2e3856b4b4027b/Qwen3.8-27B-64L-IQ2_XS.gguf" \
              --output "$MODEL"
          fi
          if ! verify_model; then
            echo "::error::Контрольная сумма модели не совпала с официальной контрольной суммой файла."
            exit 1
          fi

      - name: Собрать llama.cpp без GPU и стороннего API
        if: steps.preflight.outputs.schedule_enabled == 'true' && steps.llama-cache.outputs.cache-hit != 'true'
        env:
          LLAMA_CPP_COMMIT: 2a4daf0e08d6a9b6993ee0d4a9a3cfc35a6f405c
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_COMMIT"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DGGML_OPENMP=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4
          mkdir -p "$RUNNER_TEMP/llama.cpp/build/bin"

      - name: Начать аренду после дорогой подготовки модели
        if: steps.preflight.outputs.schedule_enabled == 'true' && steps.coder-queue.outputs.claimed == 'true'
        env:
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
          FAM_CODER_TASK_ID: ${{ steps.coder-queue.outputs.task_id }}
        run: node scripts/fam-agent-bridge.mjs start

      - name: Запустить локальную модель и подготовить patch
        if: steps.preflight.outputs.schedule_enabled == 'true'
        id: agent
        timeout-minutes: 165
        env:
          FAM_MODEL_ID: Qwen3.8-27B-IQ2_XS
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
          FAM_CODER_TASK_ID: ${{ steps.coder-queue.outputs.task_id }}
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/fam-model/Qwen3.8-27B-64L-IQ2_XS.gguf"
          SERVER="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"
          INFERENCE_HOME="/tmp/fam-inference-home"
          INFERENCE_SERVER="$INFERENCE_HOME/llama-server"
          INFERENCE_MODEL="$INFERENCE_HOME/model.gguf"
          if ! getent group fam-inference >/dev/null 2>&1; then
            sudo groupadd --system fam-inference
          fi
          if ! id fam-inference >/dev/null 2>&1; then
            sudo useradd --system --gid fam-inference --no-create-home --shell /usr/sbin/nologin fam-inference
          fi
          sudo install -d -o fam-inference -g fam-inference -m 700 "$INFERENCE_HOME"
          sudo install -o fam-inference -g fam-inference -m 500 "$SERVER" "$INFERENCE_SERVER"
          while IFS= read -r library; do
            case "$library" in
              "$RUNNER_TEMP/llama.cpp/"*)
                sudo install -o fam-inference -g fam-inference -m 400 "$library" "$INFERENCE_HOME/$(basename "$library")"
                ;;
            esac
          done < <(ldd "$SERVER" | awk '$2 == "=>" && $3 ~ /^\// {print $3} $1 ~ /^\// {print $1}')
          sudo chmod 644 "$MODEL"
          sudo ln "$MODEL" "$INFERENCE_MODEL"
          umask 077
          sudo -u fam-inference env -i \
            PATH="/usr/bin:/bin" HOME="$INFERENCE_HOME" TMPDIR="$INFERENCE_HOME" LD_LIBRARY_PATH="$INFERENCE_HOME" \
            "$INFERENCE_SERVER" -m "$INFERENCE_MODEL" \
            --host 127.0.0.1 --port 8080 -c 16384 -t 4 -np 1 --reasoning off \
            > "$RUNNER_TEMP/fam-llama-server.log" 2>&1 &
          SERVER_PID=$!
          HEARTBEAT_PID=""
          if [[ "${{ steps.coder-queue.outputs.claimed }}" == "true" ]]; then
            node scripts/fam-agent-bridge.mjs heartbeat
            (
              while sleep 300; do
                if ! node scripts/fam-agent-bridge.mjs heartbeat; then
                  echo "::error::Qwen lease heartbeat failed; stopping model work."
                  kill "$SERVER_PID" 2>/dev/null || true
                  exit 1
                fi
              done
            ) &
            HEARTBEAT_PID=$!
          fi
          cleanup() {
            if [[ -n "$HEARTBEAT_PID" ]]; then kill "$HEARTBEAT_PID" 2>/dev/null || true; fi
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=false
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Локальный сервер модели завершился до готовности."
              tail -n 80 "$RUNNER_TEMP/fam-llama-server.log"
              exit 1
            fi
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Локальная модель не запустилась за отведённое время."
            tail -n 80 "$RUNNER_TEMP/fam-llama-server.log"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fam-agent"
          git rev-parse HEAD > "$RUNNER_TEMP/fam-agent-base.sha"
          # The model controller needs repository paths and output locations only.
          # Keep bridge credentials out of its environment even though this step
          # also runs a separate heartbeat process that requires them.
          env -i \
            PATH="$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            FAM_MODEL_ID="Qwen3.8-27B-IQ2_XS" \
            FAM_TASK="${FAM_TASK:-}" \
            node scripts/run-local-coder.mjs
          if [[ -n "$HEARTBEAT_PID" ]] && ! kill -0 "$HEARTBEAT_PID" 2>/dev/null; then
            echo "::error::Heartbeat process stopped before model work finished."
            exit 1
          fi
          cp "$RUNNER_TEMP/fam-agent-base.sha" "$RUNNER_TEMP/fam-agent/base.sha"
          if [[ "$(node -e "const s=require(process.argv[1]); process.stdout.write(String(s.patch_available))" "$RUNNER_TEMP/fam-agent/summary.json")" == "true" ]]; then
            git apply --check "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          fi

      - name: Зафиксировать сбой генерации без публикации
        if: always() && steps.preflight.outputs.schedule_enabled == 'true' && steps.coder-queue.outputs.claimed == 'true' && steps.agent.outcome == 'failure'
        run: |
          echo "## FAM Qwen3.8 — генерация не прошла" >> "$GITHUB_STEP_SUMMARY"
          echo "Исправление не публикуется. Проверьте журнал модели; независимая проверка и PR не запускаются без валидного patch." >> "$GITHUB_STEP_SUMMARY"

      - name: Вернуть результат задания в очередь
        if: always() && steps.coder-queue.outputs.claimed == 'true'
        env:
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
          FAM_CODER_TASK_ID: ${{ steps.coder-queue.outputs.task_id }}
          FAM_MODEL_STEP_OUTCOME: ${{ steps.agent.outcome }}
          FAM_SUMMARY_PATH: ${{ runner.temp }}/fam-agent/summary.json
        run: node scripts/fam-agent-bridge.mjs finish

      - name: Показать структурированный результат модели
        if: always() && steps.preflight.outputs.schedule_enabled == 'true' && steps.agent.outcome == 'success'
        run: node scripts/render-fam-agent-report.mjs "$RUNNER_TEMP/fam-agent/summary.json" "$GITHUB_STEP_SUMMARY"

      - name: Сохранить patch и отчёт модели
        if: always() && steps.preflight.outputs.schedule_enabled == 'true' && steps.agent.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: fam-local-agent-result
          path: ${{ runner.temp }}/fam-agent/
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Независимая проверка без модели и секретов
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      requires_approval: ${{ steps.safety.outputs.requires_approval }}
    steps:
      - name: Получить чистую основную ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: main
          persist-credentials: false

      - name: Скачать предложенный patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: fam-local-agent-result
          path: ${{ runner.temp }}/fam-agent

      - name: Проверить базовую ревизию и разрешённые файлы
        id: safety
        run: |
          set -euo pipefail
          EXPECTED_BASE_SHA="$(cat "$RUNNER_TEMP/fam-agent/base.sha")"
          ACTUAL_BASE_SHA="$(git rev-parse HEAD)"
          if [[ "$EXPECTED_BASE_SHA" != "$ACTUAL_BASE_SHA" ]]; then
            echo "::error::Основная ветка изменилась после генерации. Patch устарел; подготовка PR отменена."
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          # Validator CLI already writes requires_approval and changed_paths to GITHUB_OUTPUT.
          node scripts/validate-local-agent-patch.mjs \
            "$RUNNER_TEMP/fam-agent/fam-agent.patch" \
            "$RUNNER_TEMP/fam-agent/summary.json" > "$RUNNER_TEMP/fam-agent/safety.json"
          git apply "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          mapfile -d '' changed_files < <(git diff --name-only -z HEAD)
          if (( ${#changed_files[@]} == 0 )); then
            echo "::error::Patch не содержит изменений."
            exit 1
          fi
          for file in "${changed_files[@]}"; do
            case "$file" in
              index.html|css/*|js/*|assets/*|docs/*|tests/*) ;;
              *)
                echo "::error::Запрещённый путь в patch: $file"
                exit 1
                ;;
            esac
          done
          has_behavior_code=false
          has_tests=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              index.html|js/*) has_behavior_code=true ;;
              tests/*) has_tests=true ;;
            esac
          done
          if [[ "$has_behavior_code" == "true" && "$has_tests" != "true" ]]; then
            # Exception only for a single, existing timeAgo function with a
            # committed independent benchmark; all other HTML/JS changes
            # still require a regression test in the proposed patch.
            if (( ${#changed_files[@]} == 1 )) && [[ "${changed_files[0]}" == "index.html" ]]; then
              node scripts/validate-local-agent-time-ago.mjs
              node --test tests/agent-benchmark/time-ago.test.mjs
            else
              echo "::error::Изменение HTML/JavaScript не содержит регрессионного теста."
              exit 1
            fi
          fi
          git diff --check HEAD

      - name: Установить Node.js для тестирования
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node v6.3.0
        with:
          node-version: "22"

      - name: Выполнить полный набор регрессионных тестов
        run: node --test tests/moderation/*.test.mjs tests/security/*.test.mjs

      - name: Отметить независимую QA как пройденную
        if: success() && needs.generate.outputs.has_patch == 'true'
        env:
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
          FAM_CODER_TASK_ID: ${{ needs.generate.outputs.fam_task_id }}
          FAM_RESULT_STAGE: qa_passed
        run: node scripts/fam-agent-bridge.mjs advance

      - name: Отметить независимую QA как проваленную
        if: failure() && needs.generate.outputs.has_patch == 'true' && needs.generate.result == 'success'
        env:
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
          FAM_CODER_TASK_ID: ${{ needs.generate.outputs.fam_task_id }}
          FAM_RESULT_STAGE: qa_failed
        run: node scripts/fam-agent-bridge.mjs advance

      - name: Проверить синтаксис скриптов локального агента
        run: |
          set -euo pipefail
          node --check scripts/run-local-coder.mjs
          node --check scripts/fam-agent-bridge.mjs
          node --check scripts/validate-local-agent-patch.mjs
          node --check scripts/validate-local-agent-time-ago.mjs

      - name: Проверить синтаксис встроенного JavaScript
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[2])
            .filter((script) => script.trim().length > 0);
          if (scripts.length === 0) throw new Error("No inline JavaScript found in index.html");
          fs.writeFileSync("/tmp/fam-inline-scripts.js", scripts.join("\n;\n"));
          NODE
          node --check /tmp/fam-inline-scripts.js

  prepare_review:
    name: Подготовить PR и проверить исправление без публикации
    needs: [generate, verify]
    if: needs.generate.outputs.has_patch == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      - name: Получить чистую основную ветку
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: main
          persist-credentials: false

      - name: Скачать patch и отчёт модели
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: fam-local-agent-result
          path: ${{ runner.temp }}/fam-agent

      - name: Создать PR; публикация всегда требует решения владельца
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRES_APPROVAL: ${{ needs.verify.outputs.requires_approval }}
        run: |
          set -euo pipefail
          node scripts/render-fam-agent-report.mjs \
            "$RUNNER_TEMP/fam-agent/summary.json" \
            "$RUNNER_TEMP/fam-agent/verified-report.md" \
            passed
          EXPECTED_BASE_SHA="$(cat "$RUNNER_TEMP/fam-agent/base.sha")"
          ACTUAL_BASE_SHA="$(git rev-parse HEAD)"
          if [[ "$EXPECTED_BASE_SHA" != "$ACTUAL_BASE_SHA" ]]; then
            echo "::error::main изменилась после тестов. Старый patch не применяется."
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          git apply "$RUNNER_TEMP/fam-agent/fam-agent.patch"
          git diff --check HEAD
          BRANCH="codex/fam-run-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "Propose verified low-risk FAM update"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null push --set-upstream origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/fam-agent/verified-report.md"
            echo
            echo "- Модель: Qwen3.8-27B-IQ2_XS, запущена локально на временном GitHub runner."
            echo "- Внешние платные API не использовались."
            echo "- Patch прошёл независимые тесты и проверку безопасности в отдельном job этого запуска."
            echo "- Supabase, миграции, права доступа и аккаунты не менялись."
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Production этим workflow не изменяется."
            echo "- Любое объединение PR и публикация требуют отдельного явного разрешения владельца."
          } > "$RUNNER_TEMP/fam-agent-pr-body.md"
          if [[ "$REQUIRES_APPROVAL" == "true" ]]; then
            PR_URL="$(gh pr create --draft --base main --head "$BRANCH" --title "Предложение локального ИИ: исправление FAM" --body-file "$RUNNER_TEMP/fam-agent-pr-body.md")"
            echo "requires_approval=true" >> "$GITHUB_OUTPUT"
          else
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Исправление FAM после тестов — ожидает разрешения" --body-file "$RUNNER_TEMP/fam-agent-pr-body.md")"
            echo "requires_approval=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Дождаться независимых проверок PR и оставить его на утверждение владельца
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          FAM_AGENT_BRIDGE_URL: ${{ secrets.FAM_AGENT_BRIDGE_URL }}
          FAM_AGENT_WORKER_TOKEN: ${{ secrets.FAM_AGENT_WORKER_TOKEN }}
          FAM_CODER_TASK_ID: ${{ needs.generate.outputs.fam_task_id }}
        run: |
          set -euo pipefail
          # Step-local shell variables do not survive into this step.
          BRANCH="codex/fam-run-${GITHUB_RUN_ID}"
          BRANCH_SHA="$(git rev-parse HEAD)"
          gh workflow run .github/workflows/moderation-regression.yml --ref "$BRANCH"
          TEST_RUN_ID=""
          for attempt in $(seq 1 60); do
            if (( attempt % 12 == 0 )) && [[ -n "${FAM_CODER_TASK_ID:-}" ]]; then
              node scripts/fam-agent-bridge.mjs heartbeat
            fi
            TEST_RUN_ID="$(gh run list --workflow .github/workflows/moderation-regression.yml --branch "$BRANCH" --limit 20 --json databaseId,headSha,event --jq ".[] | select(.headSha == \"$BRANCH_SHA\" and .event == \"workflow_dispatch\") | .databaseId" | head -n 1)"
            [[ -n "$TEST_RUN_ID" ]] && break
            sleep 5
          done
          if [[ -z "$TEST_RUN_ID" ]]; then
            echo "::error::Не найден отдельный запуск регрессионных тестов для ветки агента."
            exit 1
          fi
          gh run watch "$TEST_RUN_ID" --exit-status --interval 10
          TEST_CONCLUSION="$(gh run view "$TEST_RUN_ID" --json conclusion --jq '.conclusion')"
          if [[ "$TEST_CONCLUSION" != "success" ]]; then
            echo "::error::Независимый CI не прошёл: $TEST_CONCLUSION"
            exit 1
          fi
          gh pr comment "$PR_URL" --body "Независимые регрессионные проверки прошли успешно. Production не изменён. PR оставлен открытым: для публикации требуется отдельное явное разрешение владельца и ручное объединение PR."
          if [[ -n "${FAM_CODER_TASK_ID:-}" ]]; then
            export FAM_RESULT_STAGE="qa_passed"
            node scripts/fam-agent-bridge.mjs advance
            export FAM_RESULT_STAGE="pr_created"
            export FAM_PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq .number)"
            node scripts/fam-agent-bridge.mjs advance
          fi
        if: success()
      - name: Сохранить отчёт о PR
        if: always()
        run: |
          echo "Результат локального ИИ-разработчика FAM:"
          echo "PR: ${{ steps.pr.outputs.pr_url }}"
          echo "Автоматическое объединение и публикация запрещены; PR ожидает отдельного разрешения владельца."
