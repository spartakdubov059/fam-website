name: FAM Development Advisor SQL contract

on:
  pull_request:
    paths:
      - "tests/fixtures/fam-development-advisor/**"
      - "supabase/migrations/*fam_development_advisor*"

permissions:
  contents: read

jobs:
  advisor-sql-contract:
    name: Проверить SQL Советника на одноразовой PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Подготовить синтетические агрегаты без пользовательских данных
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/setup.sql
      - name: Применить исходную миграцию агрегатов Советника
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261127050000_fam_development_advisor_aggregate_snapshots.sql
      - name: Применить privacy-banded обновление результата RPC
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261128085459_fam_development_advisor_privacy_banded_snapshots.sql
      - name: Проверить исходный privacy-banded контракт перед расширением
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/assertions-before-upgrade.sql
      - name: Добавить privacy-banded сигнал очереди идей
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261128100000_fam_development_advisor_idea_backlog_band.sql
      - name: Проверить границы данных и прав
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/assertions.sql
      - name: Откатить поле диапазона и проверить сохранность старого контракта
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/rollback-idea-backlog-band.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/assertions-before-upgrade.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/assertions-after-rollback.sql
      - name: Повторно применить forward migration
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261128100000_fam_development_advisor_idea_backlog_band.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-development-advisor/assertions.sql
