  $("profileStudentIdentityForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!user || !profile) return;
    const first_name = $("profileFirstName").value.trim();
    const last_name = $("profileLastName").value.trim();
    const class_name = $("profileClassName").value.trim().toUpperCase().replace(/\s+/g, "");
    const status = $("profileStudentIdentityStatus");
    if (!first_name || !last_name || !/^[1-9][0-9]?[А-ЯЁA-Z]?$/.test(class_name)) {
      if (status) status.textContent = "Проверьте имя, фамилию и класс (например, 8А).";
      return;
    }
    const button = e.target.querySelector('button[type="submit"]');
    if (button) { button.disabled = true; button.textContent = "Сохраняем..."; }
    if (status) status.textContent = "";
    try {
      const { data, error } = await sb.from("profiles")
        .update({ first_name, last_name, class_name })
        .eq("id", user.id)
        .select("first_name,last_name,class_name")
        .single();
      if (error) throw error;
      Object.assign(profile, data);
      if (status) status.textContent = "Данные сохранены.";
      notice("Данные профиля обновлены.");
    } catch (error) {
      if (status) status.textContent = error?.message || "Не удалось сохранить данные.";
    } finally {
      if (button) { button.disabled = false; button.textContent = "Сохранить данные"; }
    }
  };

  $("avatarInput").onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file || !user) return;
    let uploadedAvatarPath = null;
    try {
      const safeImage = await prepareImageForUpload(file, 2 * 1024 * 1024, 512);
      const extension = getImageExtension(safeImage);
      const fileName = `${user.id}/avatar_${user.id}_${makeUniqueFileSuffix()}.${extension}`;
      const pendingStorage = sb.storage.from("avatars-pending");
      const { error: uploadError } = await pendingStorage.upload(fileName, safeImage, {
        upsert: false,
        contentType: safeImage.type,
        cacheControl: "600"
      });
      if (uploadError) throw uploadError;
      uploadedAvatarPath = fileName;

      const { data: signed, error: signedError } = await pendingStorage.createSignedUrl(fileName, 10 * 60);
      if (signedError || !signed?.signedUrl) throw new Error("Не удалось подготовить защищённую ссылку для проверки аватара.");

      const { data: submission, error } = await sb.functions.invoke("submit-content", {
        body: { kind: "avatar", image_url: signed.signedUrl }
      });
      if (error) throw error;
      if (!submission?.ok || !["approved", "pending"].includes(submission.status)) {
        throw new Error(submission?.reason || submission?.error || "Не удалось сохранить фото для проверки.");
      }

      uploadedAvatarPath = null; // The server has published the avatar or safely queued it.
      if (submission.status === "approved" && submission.avatar_url) {
        if (profile) profile.avatar_url = submission.avatar_url;
        updateAuthUI();
        await renderProfile();
        notice(submission.avatar_review_bypassed ? "Аватар обновлён." : "Аватар проверен и обновлён.");
      } else {
        notice(submission.reason || "Фото сохранено приватно. Предыдущий аватар останется видимым до завершения проверки.");
      }
    } catch (err) {
      if (uploadedAvatarPath) {
        try {
          await sb.storage.from("avatars-pending").remove([uploadedAvatarPath]);
        } catch (cleanupError) {
          console.warn("Не удалось удалить временный аватар:", cleanupError);
        }
      }
      alert("Аватар не обновлён: " + (err?.message || "Ошибка проверки."));
    } finally {
      e.target.value = "";
    }
  };

  $("authForm").onsubmit = async e => {
    e.preventDefault();
    let email = $("authEmail").value, pass = $("authPassword").value;
    let isReg = $("authTitle").textContent === "Регистрация";
    let school = $("authSchool").value;
    try {
      if (isReg && pass.length < 8) {
        $("authMsg").textContent = "Для нового аккаунта используйте пароль не короче 8 символов.";
        $("authPassword").value = "";
        return;
      }
      let res;
      if (isReg) {
        const firstName = $("authFirstName").value.trim();
        const lastName = $("authLastName").value.trim();
        const className = $("authClassName").value.trim().toUpperCase().replace(/\s+/g, "");
        if (!firstName || !lastName || !/^[1-9][0-9]?[А-ЯЁA-Z]?$/.test(className)) {
          $("authMsg").textContent = "Укажите имя, фамилию и корректный класс, например 8А.";
          return;
        }
        res = await sb.auth.signUp({ email, password: pass, options: { data: {
          school_id: school,
          first_name: firstName,
          last_name: lastName,
          class_name: className
        }, emailRedirectTo: "/" } });
        if (res.error) throw res.error;
        if (!res.data.session) {
          closeModal('authModal');
          alert("Регистрация успешна! Проверьте почту для подтверждения.");
          return;
        }
      } else {
        res = await sb.auth.signInWithPassword({ email, password: pass });
        if (res.error) throw res.error;
        const { data: pd, error: profileReadError } = await sb.from("profiles")
          .select("id,avatar_url,created_at,city,school_id,role,first_name,last_name,class_name")
          .eq("id", res.data.user.id).maybeSingle();
        if (profileReadError) throw profileReadError;
        if (!pd) throw new Error("Профиль не найден. Обратитесь к администратору FAM.");
      }
      closeModal('authModal');
      if (isReg) alert("✅ Регистрация успешна!");
      location.reload();
    } catch(err) {
      if (Number(err?.status) >= 500 || err?.name === "AuthRetryableFetchError" || err instanceof TypeError) {
        reportFamSiteError("auth_backend_failed", "auth");
      }
      $("authMsg").textContent = err.message;
      $("authPassword").value = "";
    }
  };

  function positionIndicator(squish) {
    const ind = $("tabIndicator");
    const active = document.querySelector(".tab-btn.active .tab-ico");
    if (!active) { ind.classList.add("idle"); return; }
    const wasIdle = ind.classList.contains("idle");
    ind.classList.remove("idle");
    const barRect = $("tabbar").getBoundingClientRect();
    const icoRect = active.getBoundingClientRect();
    const x = icoRect.left - barRect.left + (icoRect.width - ind.offsetWidth) / 2;
    const y = icoRect.top - barRect.top + (icoRect.height - ind.offsetHeight) / 2;
    ind.style.transform = `translate(${x}px, ${y}px)`;
    if (squish && !wasIdle) {
      ind.classList.remove("moving"); void ind.offsetWidth; ind.classList.add("moving");
    }
  }
  window.addEventListener("resize", () => positionIndicator(false));

    const toSection = $(name + 'Section');
    const mainEl = $("mainContent");
    const dir = TAB_ORDER.indexOf(name) > TAB_ORDER.indexOf(fromName) ? 1 : -1;

    // Normalize any interrupted transition before starting a new one.
    document.querySelectorAll("main > section").forEach(section => {
      section.classList.add("hidden");
      section.classList.remove("page-out-left", "page-out-right", "page-in-left", "page-in-right");
      section.style.position = "";
      section.style.inset = "";
      section.style.width = "";
      section.style.pointerEvents = "";
    });
    mainEl.style.minHeight = "";
    mainEl.style.overflow = "";

    previousTab = fromName;
    currentTab = name;
    document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    positionIndicator(true);

    if (!forceNoAnim && fromSection && toSection) {
      fromSection.classList.remove("hidden");
      const oldHeight = fromSection.offsetHeight;
      mainEl.style.minHeight = oldHeight + 'px';
      mainEl.style.overflow = 'hidden';
      fromSection.style.position = 'absolute';
      fromSection.style.inset = '0';
      fromSection.style.width = '100%';
      fromSection.style.pointerEvents = 'none';
      fromSection.classList.add(dir > 0 ? 'page-out-left' : 'page-out-right');
      toSection.classList.remove('hidden');
      toSection.classList.add(dir > 0 ? 'page-in-right' : 'page-in-left');
      tabTransitionTimer = setTimeout(() => {
        fromSection.classList.add('hidden');
        fromSection.style.position = '';
        fromSection.style.inset = '';
        fromSection.style.width = '';
        fromSection.style.pointerEvents = '';
        fromSection.classList.remove('page-out-left', 'page-out-right');
        toSection.classList.remove('page-in-right', 'page-in-left');
        mainEl.style.minHeight = '';
        mainEl.style.overflow = '';
        tabTransitionTimer = null;
      }, 430);
    } else {
      toSection.classList.remove('hidden');
    }

    if (name !== 'messages') {
      stopChatSession(true);
      $("dialogsGuest")?.classList.add("hidden");
    } else if (user) {
      $("dialogsGuest")?.classList.add("hidden");
      loadDialogsList();
    } else {
      $("dialogsList").innerHTML = "";
      $("chatView").classList.add("hidden");
      $("dialogsGuest")?.classList.remove("hidden");
    }

    if (name !== 'board') stopHeroTimer();
    else startHeroTimer();

    if (name === 'profile') {
      renderProfile();
    }
    if (name === 'board') loadAll();
    if (name === 'favorites') renderFavorites();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('.tab-btn[data-tab]').forEach(b => {
    b.onclick = (e) => { e.preventDefault(); showTab(b.dataset.tab); };
  });

  function jumpToProfileSection(targetId) {
    let target = targetId ? $(targetId) : null;
    if ((!target || target.classList.contains("hidden")) && targetId === "schoolAdminAccess") {
      const councilPanel = $("adminIdeasDash");
      target = councilPanel && !councilPanel.classList.contains("hidden")
        ? councilPanel
        : $("profileAccountPanel");
    }
    if (!target || target.classList.contains("hidden")) target = $("profileAccountPanel");
    if (!target) return;
    const details = target.closest("details");
    if (details) details.open = true;
    if (target.tagName === "DETAILS") target.open = true;
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'go-board') { e.preventDefault(); showTab('board'); }
    else if (action === 'go-profile') { e.preventDefault(); showTab('profile'); }
    else if (action === 'open-auth') { e.preventDefault(); openModal('authModal'); }
    else if (action === 'close-auth-modal') { closeModal('authModal'); }
    else if (action === 'close-listing-modal') { closeModal('listingModal'); }
    else if (action === 'open-listing-details') { openListingDetails(btn.dataset.id); }
    else if (action === 'close-listing-details') { closeModal('listingDetailsModal'); }
    else if (action === 'close-notif') { closeNotifPanel(); }
    else if (action === 'mark-notification-read') { markNotificationRead(btn.dataset.id); }
    else if (action === 'dismiss-notification') { dismissNotification(btn.dataset.id); }
    else if (action === 'mark-all-notifications-read') { markNotificationsRead(notificationsCache.map(item => item.id)); }
    else if (action === 'clear-notifications') { clearNotifications(); }
    else if (action === 'open-notification-chat') { window.startChat(btn.dataset.userId, 'Новый диалог'); closeNotifPanel(); }
    else if (action === 'select-hint-category') {
      const category = btn.dataset.category;
      const allowed = ["Вещи", "Услуги", "Творчество", "Учёба"].includes(category) ||
        (category === "Мероприятия" && $("evOption").style.display !== "none");
      if (allowed) {
        $("lCat").value = category;
        $("eventFields").classList.toggle("hidden", category !== "Мероприятия");
        updateHints();
        renderDescriptionHelper();
      }
    }
    else if (action === 'open-description-helper') { openDescriptionHelper(); }
    else if (action === 'close-description-helper') { $("descriptionHelperPanel").classList.add("hidden"); }
    else if (action === 'apply-description-draft') { applyDescriptionDraft(); }
    else if (action === 'reset-search') {
      curCat = "Все";
      document.querySelectorAll(".cat-tile").forEach(x => x.classList.remove('active'));
      $("searchInput").value = "";
      renderListings();
    }
    else if (action === 'scroll-listings') { $("listingsGrid").scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (action === 'scroll-to-slide') {
      const idx = parseInt(btn.dataset.idx);
      const box = $("bannerCarousel");
      const cardW = box.children[0] ? box.children[0].offsetWidth + 14 : 1;
      box.scrollTo({ left: idx * cardW, behavior: 'smooth' });
    }
    else if (action === 'cat') {
      const cat = btn.dataset.cat;
      curCat = cat;
      document.querySelectorAll(".cat-tile").forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
      renderListings();
      $("listingsGrid").scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    else if (action === 'open-listing') {
      if (user) openModal('listingModal'); else openModal('authModal');
    }
    else if (action === 'toggle-fav') { toggleFavoriteAction(btn.dataset.id); }
    else if (action === 'delete-own-listing') { deleteOwnListing(btn.dataset.id); }
    else if (action === 'cancel-reg') { cancelRegAction(btn.dataset.id); }
    else if (action === 'start-chat') { window.startChat(btn.dataset.userId, btn.dataset.title); }
    else if (action === 'open-dialog') { window.startChat(btn.dataset.userId, "Диалог"); }
    else if (action === 'handle-event') { window.handleEventBtn(btn.dataset.id); }
    else if (action === 'chat-back') {
      stopChatSession(true);
      loadDialogsList();
    }
    else if (action === 'profile-jump') { jumpToProfileSection(btn.dataset.target); }
    else if (action === 'clear-my-ideas') { window.clearMyIdeas(); }
    else if (action === 'apply-school-admin') { submitSchoolAdminRequest(); }
    else if (action === 'refresh-council-admin') { loadCouncilAdminTools(); loadUserSafetyReports(); }
    else if (action === 'refresh-safety-reports') { loadUserSafetyReports(); }
    else if (action === 'acknowledge-safety-report') { acknowledgeSafetyReport(btn); }
    else if (action === 'submit-account-deletion-request') { submitCouncilAccountDeletionRequest(); }
    else if (action === 'review-account-deletion') { reviewCouncilAccountDeletion(btn.dataset.id, btn.dataset.decision); }
    else if (action === 'self-delete-account') { deleteMyAccount(); }
    else if (action === 'revoke-council-role') { manageCouncilRole(btn.dataset.id); }
    else if (action === 'delete-council-account') { manageCouncilAccount(btn); }
    else if (action === 'moderate-school-listing') { manageSchoolListing(btn); }
    else if (action === 'delete-school-listing') { manageSchoolListing(btn); }
    else if (action === 'suspend-council-account') { suspendCouncilAccount(btn); }
    else if (action === 'lift-council-suspension') { liftCouncilSuspension(btn.dataset.id); }
    else if (action === 'start-school-admin-review') { startSchoolAdminReview(btn.dataset.id); }
    else if (action === 'review-school-admin') { reviewSchoolAdminRequest(btn.dataset.id, btn.dataset.decision); }
    else if (action === 'clear-folder') { window.clearFolderIdeas(btn.dataset.folder); }
    else if (action === 'update-idea') { window.updateIdea(btn.dataset.id, btn.dataset.status); }
    else if (action === 'confirm-reg') { window.confirmReg(btn.dataset.id, btn.dataset.evid, btn.dataset.actionType); }
    else if (action === 'logout') {
      btn.disabled = true;
      btn.textContent = "Выход...";
      sb.auth.signOut().then(({ error }) => {
        if (error) throw error;
        location.reload();
      }).catch(err => {
        btn.disabled = false;
        btn.textContent = "Выйти";
        alert("Не удалось выйти: " + err.message);
      });
    }
  });

  let tX = null, tY = null;
  document.addEventListener('touchstart', e => {
    if (e.target.closest('.tabbar, .modal, input, textarea, select, .hero, .form-control, .notif-panel')) return;
    tX = e.touches[0].clientX; tY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tX === null) return;
    const dx = e.changedTouches[0].clientX - tX, dy = e.changedTouches[0].clientY - tY; tX = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      let i = TAB_ORDER.indexOf(currentTab) + (dx < 0 ? 1 : -1);
      if (i >= 0 && i < TAB_ORDER.length) showTab(TAB_ORDER[i]);
    }
  }, { passive: true });

  document.querySelectorAll(".cat-tile").forEach(t => t.onclick = () => {
    const cat = t.dataset.cat;
    if (curCat === cat) { curCat = "Все"; t.classList.remove('active'); }
    else { curCat = cat; document.querySelectorAll(".cat-tile").forEach(x => x.classList.toggle('active', x.dataset.cat === cat)); }
    renderListings();
  });

  document.querySelectorAll(".idea-folder").forEach(f => {
    f.onclick = () => window.switchIdeaFolder(f.dataset.folder);
  });

  $("searchInput").addEventListener('input', debounce(() => { renderListings(); }, 300));

  $("lCat").onchange = function() { $("eventFields").classList.toggle("hidden", this.value !== "Мероприятия"); };
  document.querySelectorAll('input[name="evType"]').forEach(r => r.onchange = function() {
    $("seatsGroup").classList.toggle("hidden", this.value !== "limited");
  });

  $("listingForm").onsubmit = async e => {
    e.preventDefault();
    // ═══ ЗАЩИТА ОТ ДВОЙНОЙ ОТПРАВКИ ═══
    if (isListingSubmitting) return;
    isListingSubmitting = true;
    let uploadedImagePath = null;
    let btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "Проверка...";

    try {
      const uploadStatus = $("uploadStatus");

      btn.textContent = "Загрузка фото и серверная проверка...";

      let isEv = $("lCat").value === "Мероприятия";
      let type = document.querySelector('input[name="evType"]:checked')?.value || 'open';
      let imageUrl = null;

      const file = $("lImage").files[0];
      if (file) {
        const safeImage = await prepareImageForUpload(file, 5 * 1024 * 1024, 1600);
        const extension = getImageExtension(safeImage);
        uploadStatus.textContent = '';
        const st = document.createElement('div');
        st.className = 'upload-status'; st.textContent = 'Загрузка фото...';
        uploadStatus.appendChild(st);

        const fileName = `${user.id}/listing_${user.id}_${makeUniqueFileSuffix()}.${extension}`;
        const pendingStorage = sb.storage.from('listing-images-pending');
        const { error } = await pendingStorage.upload(fileName, safeImage, {
          cacheControl: '600', upsert: false, contentType: safeImage.type
        });
        if (error) throw new Error("Ошибка загрузки фото: " + error.message);
        uploadedImagePath = fileName;
        const { data: signed, error: signedError } = await pendingStorage.createSignedUrl(fileName, 10 * 60);
        if (signedError || !signed?.signedUrl) {
          await pendingStorage.remove([fileName]);
          throw new Error("Не удалось подготовить защищённую ссылку для проверки фото.");
        }
        imageUrl = signed.signedUrl;

        uploadStatus.textContent = '';
        const suc = document.createElement('div');
        suc.className = 'upload-status success'; suc.textContent = '✓ Фото загружено приватно — проверяем перед публикацией';
        uploadStatus.appendChild(suc);
      }

      const { data: submission, error } = await sb.functions.invoke("submit-content", {
        body: {
          kind: "listing",
          title: $("lTitle").value,
          description: $("lDesc").value,
          category: $("lCat").value,
          price_text: FAMPrice.formatListingPrice($("lPrice").value),
          image_url: imageUrl,
          event_date: isEv ? ($("evDate").value || null) : null,
          event_time: isEv ? ($("evTime").value || null) : null,
          event_type: isEv ? type : null,
          max_seats: (isEv && type === "limited") ? parseInt($("evSeats").value, 10) : 0
        }
      });
      if (error) throw error;
      updateAiStatus(submission?.degraded === true);
      if (!submission?.ok) throw new Error(submission?.reason || submission?.error || "Объявление не прошло модерацию.");

      const data = submission.listing;
      uploadedImagePath = null; // The server now owns the staged file or the published listing image.
      if (data) listings.unshift(data);

      closeModal('listingModal');
      $("listingForm").reset();
      $("pricePreview").textContent = "Введите сумму — FAM автоматически добавит ₽. Для бесплатного объявления укажите «Бесплатно».";
      uploadStatus.innerHTML = '';
      $("aiHints").textContent = "Начните вводить название и описание — FAM подскажет категорию.";
      $("descriptionHelperPanel").classList.add("hidden");

      if (submission.status === "pending") {
        await loadAll();
        renderProfile();
        alert(submission.reason || "✅ Объявление сохранено. Фото проверяется автоматически — повторно отправлять его не нужно.");
      } else {
        renderListings();
        if (submission.photo_review_bypassed === true) {
          notice("Фото опубликовано без ИИ-проверки изображения для подтверждённой роли. Текст объявления прошёл обычную проверку FAM.");
        }
      }
    } catch (error) {
      const uploadStatus = $("uploadStatus");
      const friendlyError = await functionErrorText(error, "Не удалось опубликовать объявление.");
      if (uploadStatus) {
        uploadStatus.textContent = '';
        const errDiv = document.createElement('div');
        errDiv.className = 'upload-status error';
        errDiv.textContent = 'Ошибка: ' + friendlyError;
        uploadStatus.appendChild(errDiv);
      }
      if (uploadedImagePath) {
        // Best-effort cleanup for a file uploaded before a failed database insert.
        try {
          const { error: removeError } = await sb.storage.from('listing-images-pending').remove([uploadedImagePath]);
          if (removeError) console.warn("Не удалось удалить неиспользуемое фото:", removeError.message);
        } catch (cleanupError) {
          console.warn("Не удалось удалить неиспользуемое фото:", cleanupError);
        }
      }
      alert(await functionErrorText(error, "Не удалось опубликовать объявление."));
    } finally {
      isListingSubmitting = false;
      btn.disabled = false; btn.textContent = "Опубликовать";
    }
  };

  $("fabBtn").onclick = (e) => {
    e.stopPropagation();
    if (user) openModal('listingModal'); else openModal('authModal');
  };

  sb.auth.getSession().then(res => {
    user = res.data?.session?.user || null;
    if(user) return sb.from("profiles")
      .select("id,avatar_url,created_at,city,school_id,role,first_name,last_name,class_name")
      .eq("id", user.id).maybeSingle();
    return null;
  }).then(res => {
    if(res && res.data) profile = res.data;
    updateAuthUI();
    requestAnimationFrame(() => positionIndicator(false));
    setTimeout(() => positionIndicator(false), 100);
    return loadAll();
  }).catch(err => {
    console.error("Auth error:", err);
    return loadAll();
  }).then(() => {
    if(user && ["school_admin", "council_member"].includes(profile?.role)) $("evOption").style.display = "block";
  });
})();
</script>
</body>
</html>
