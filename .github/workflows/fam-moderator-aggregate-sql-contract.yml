name: FAM Moderator aggregate SQL contract

on:
  pull_request:
    paths:
      - "supabase/migrations/*fam_moderator_aggregate_summary.sql"
      - "tests/fixtures/fam-moderator-aggregate/**"
      - ".github/workflows/fam-moderator-aggregate-sql-contract.yml"

permissions:
  contents: read

jobs:
  moderator-sql-contract:
    name: Проверить агрегат модерации на одноразовой PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Подготовить синтетические сигналы без данных учеников
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-moderator-aggregate/setup.sql
      - name: Применить миграцию
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261127055859_fam_moderator_aggregate_summary.sql
      - name: Проверить порог скрытия и права
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/fixtures/fam-moderator-aggregate/assertions.sql
