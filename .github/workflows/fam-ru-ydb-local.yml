name: FAM RU local YDB integration
on:
  push:
    branches: ["migration/yandex-cloud"]
    paths:
      - "ru-migration/app/backend/**"
      - "ru-migration/app/backend/schema/**"
      - "ru-migration/compat/**"
      - ".github/workflows/fam-ru-ydb-local.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-ydb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked SDK dependencies
        run: npm ci --prefix ru-migration/compat --no-audit --no-fund
      - name: Start disposable local database
        run: docker run -d --name fam-ru-test-ydb --hostname localhost -p 127.0.0.1:2136:2136 -e GRPC_PORT=2136 -e YDB_GRPC_ENABLE_TLS=false -e YDB_USE_IN_MEMORY_PDISKS=true ydbplatform/local-ydb@sha256:9e46fd45875551a75bcf34d0bb9ca0baa1d8763a4ccf2070af45f4467c4b7402
      - name: Wait for database and apply isolated schema
        shell: bash
        run: |
          schema="$(cat ru-migration/app/backend/schema/01_listings.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/02_user_profiles.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/03_favorites.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/04_ideas.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/05_messages.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/06_event_registrations.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/07_profile_requests.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/08_account_suspensions.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/09_school_role_requests.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/10_pending_media.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/11_account_deletion_requests.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/12_account_suspension_audit.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/13_account_suspension_open.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/14_school_admin_audit.yql)"
          schema+=$'\n'
          schema+="$(cat ru-migration/app/backend/schema/15_school_pulse.yql)"
          for i in $(seq 1 120); do
            if docker exec fam-ru-test-ydb /ydb -e grpc://localhost:2136 -d /local --no-discovery sql -s "$schema" > /tmp/fam-ydb-schema.log 2>&1; then break; fi
            if [ "$i" = 120 ]; then cat /tmp/fam-ydb-schema.log; docker logs fam-ru-test-ydb; exit 1; fi
            sleep 2
          done
      - name: Exercise schema and repository with synthetic data
        run: node ru-migration/compat/integration-ydb.mjs
      - name: Remove disposable database
        if: always()
        run: docker rm -f fam-ru-test-ydb || true
