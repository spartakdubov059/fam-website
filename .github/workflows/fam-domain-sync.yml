name: FAM — verify both production domains

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/fam-domain-sync.yml"
      - "scripts/check-fam-domain-sync.mjs"
      - "tests/security/fam-domain-sync.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-domain-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the domain comparison and path rules
        run: node --test tests/security/fam-domain-sync.test.mjs

  production-sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait until both domains serve the same committed files
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          FAM_NETLIFY_PUBLISH_ENABLED: ${{ vars.FAM_NETLIFY_PUBLISH_ENABLED }}
        run: node scripts/check-fam-domain-sync.mjs
